    const wv = document.getElementById('view-watched');
    if (wv && !wv.hidden) renderWatched();
  }

  // Dim the chips of watched events in the month currently rendered. Chips
  // carry data-event-id (set in renderCalendar).
  function markWatchedChips() {
    if (!calEl) return;
    calEl.querySelectorAll('.mini-chip[data-event-id]').forEach(chip => {
      chip.classList.toggle('watched', watched.has(chip.dataset.eventId));
    });
  }

  function refreshWatchedUI() {
    const total = (BUNDLE && BUNDLE.meta && BUNDLE.meta.event_count) || watched.size;
    const countEl = el('watched-count'), totalEl = el('watched-total'), fill = el('wp-fill');
    if (countEl) countEl.textContent = watched.size.toLocaleString('en-US');
    if (totalEl) totalEl.textContent = Number(total).toLocaleString('en-US');
    if (fill) {
      const pct = total ? Math.min(100, (watched.size / total) * 100) : 0;
      fill.style.width = pct + '%';
      fill.style.minWidth = watched.size > 0 ? '3px' : '0';
    }
    mContent.querySelectorAll('[data-watched-id]').forEach(btn => {
      const on = watched.has(btn.getAttribute('data-watched-id'));
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      const lbl = btn.querySelector('.wb-label');
      if (lbl) lbl.textContent = on ? 'Watched' : 'Mark watched';
      btn.title = on ? 'Mark as not watched' : 'Mark this show watched';
    });
    markWatchedChips();
  }

  // ------------------ Watched history (Netflix-style) ---------------------
  // A browsable log of every show marked watched, reached via the progress
  // meter or the Watched tab. Each row reopens its card so you can revisit it.
  let watchedFilter = 'all';
  let watchedSort = 'recent';

  function setupWatchedNav() {
    const meter = el('watch-progress');
    if (meter) meter.addEventListener('click', () => { window.location.hash = '#watched'; });
    const filters = el('watched-filters');
    if (filters) filters.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-wfilter]');
      if (!chip) return;
      watchedFilter = chip.getAttribute('data-wfilter');
      renderWatched();
    });
    const sortSel = el('watched-sort');
    if (sortSel) sortSel.addEventListener('change', () => { watchedSort = sortSel.value; renderWatched(); });
  }

  function renderWatched() {
    const container = el('watched-view-content');
    if (!container) return;
    const total = (BUNDLE && BUNDLE.meta && BUNDLE.meta.event_count) || watched.size;
    const items = [];
    for (const [id, ts] of watched) {
      const ev = BUNDLE && BUNDLE.events && BUNDLE.events[id];
      if (ev) items.push({ ev, ts });
    }
    const sub = el('watched-sub');
    if (sub) sub.textContent = `${watched.size.toLocaleString('en-US')} of ${Number(total).toLocaleString('en-US')} shows watched`;
    const fill = el('watched-view-fill');
    if (fill) fill.style.width = (total ? Math.min(100, watched.size / total * 100) : 0) + '%';

    const counts = { all: items.length, Raw: 0, SmackDown: 0, PPV: 0 };
    for (const it of items) if (counts[it.ev.show_type] != null) counts[it.ev.show_type]++;
    document.querySelectorAll('#watched-filters [data-wcount]').forEach(n => {
      n.textContent = (counts[n.getAttribute('data-wcount')] || 0).toLocaleString('en-US');
    });
    document.querySelectorAll('#watched-filters [data-wfilter]').forEach(c => {
      c.classList.toggle('active', c.getAttribute('data-wfilter') === watchedFilter);
    });

    if (!items.length) {
      container.innerHTML = `<div class="saved-empty">Nothing watched yet. Open a show and hit <strong>Mark watched</strong> to build your history here.</div>`;
      return;
    }
    let list = watchedFilter === 'all' ? items.slice() : items.filter(it => it.ev.show_type === watchedFilter);
    if (watchedSort === 'recent') list.sort((a, b) => (b.ts || 0) - (a.ts || 0) || (b.ev.air_date || '').localeCompare(a.ev.air_date || ''));
    else list.sort((a, b) => (a.ev.air_date || '').localeCompare(b.ev.air_date || ''));
    if (!list.length) {
      container.innerHTML = `<div class="saved-empty">No watched shows in this filter.</div>`;
      return;
    }
    container.innerHTML = list.map(({ ev }) => {
      const showName = ev.show_type === 'PPV' ? (ev.ppv_name || ev.title) : (ev.title || 'Event');
      const cls = SHOW_CLASS[ev.show_type] || '';
      return `
        <button class="watched-row" type="button" data-go-event="${esc(String(ev.id))}">
          <span class="wr-check" aria-hidden="true"></span>
          <span class="wr-date">${esc(fmtDateLong(ev.air_date))}</span>
          <span class="wr-show"><span class="brand-chip ${cls}">${esc(ev.show_type === 'PPV' ? 'PPV' : ev.show_type)}</span><span class="wr-name">${esc(showName)}</span></span>
          <span class="wr-meta">${ev.match_count != null ? esc(ev.match_count + ' matches') : ''}</span>
          <span class="wr-go">Rewatch</span>
          <span class="wr-remove" data-unwatch="${esc(String(ev.id))}" role="button" tabindex="0" title="Remove from watched">Remove</span>
        </button>`;
    }).join('');
    container.querySelectorAll('.watched-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-unwatch]')) return;
        navigateToEvent(row.getAttribute('data-go-event'));
      });
    });
    container.querySelectorAll('[data-unwatch]').forEach(rm => {
      const h = (e) => {
        e.stopPropagation(); e.preventDefault();
        watched.delete(rm.getAttribute('data-unwatch'));
        saveWatched(); refreshWatchedUI(); renderWatched();
      };
      rm.addEventListener('click', h);
      rm.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') h(e); });
    });
  }

  // ------------------ Saved matches ---------------------------------------
  // Curated collection of individual matches, in localStorage per browser/
  // device. Distinct from Resume (one show, "where I am") and Watched (shows
  // completed). Each entry is the string "eventId:matchId".
  const SAVED_KEY = 'wvez_wrestling_saved';
  const savedKey = (e, m) => `${e}:${m}`;
  let saved = (() => {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch (_) {}
    return new Set(Array.isArray(arr) ? arr.map(String) : []);
  })();

  function persistSaved() {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify([...saved])); } catch (_) {}
  }

  function toggleSaved(eventId, matchId) {
    if (eventId == null || matchId == null) return;
    const key = savedKey(eventId, matchId);
    if (saved.has(key)) saved.delete(key);
    else saved.add(key);
    persistSaved();
    refreshSavedUI();
    const sv = document.getElementById('view-saved');
    if (sv && !sv.hidden) renderSaved();
  }

  function updateSavedTabCount() {
    const badge = el('saved-tab-count');
    if (!badge) return;
    badge.textContent = saved.size ? String(saved.size) : '';
    badge.hidden = saved.size === 0;
  }

  function refreshSavedUI() {
    mContent.querySelectorAll('[data-save-match]').forEach(btn => {
      const on = saved.has(savedKey(btn.getAttribute('data-save-event'), btn.getAttribute('data-save-match')));
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      const lbl = btn.querySelector('.sv-label');
      if (lbl) lbl.textContent = on ? 'Saved' : 'Save';
      btn.title = on ? 'Saved. Click to remove.' : 'Save this match';
    });
    updateSavedTabCount();
  }

  // Spoiler-safe matchup label: who is in the match, never the winner.
  function matchupLabel(m) {
    return (m.teams || [])
      .map(t => (t.participants && t.participants.length ? t.participants.join(' & ') : (t.team_name || '')).trim())
      .filter(Boolean)
      .join(' vs ');
  }

  function renderSaved() {
    const container = el('saved-view-content');
    const sub = el('saved-sub');
    if (!container) return;
    const items = [];
    for (const key of saved) {
      const [eid, mid] = key.split(':');
      const ev = BUNDLE && BUNDLE.events && BUNDLE.events[eid];
      if (!ev) continue;
      const match = (ev.matches || []).find(x => String(x.id) === String(mid));
      if (match) items.push({ ev, match });
    }
    if (sub) sub.textContent = items.length ? `${items.length} match${items.length === 1 ? '' : 'es'} saved` : '';
    if (!items.length) {
      container.innerHTML = `<div class="saved-empty">No saved matches yet. Open any show and hit <strong>Save</strong> on a match to keep it here.</div>`;
      return;
    }
    items.sort((a, b) =>
      (a.ev.air_date || '').localeCompare(b.ev.air_date || '') ||
      (a.match.match_order || 0) - (b.match.match_order || 0)
    );
    container.innerHTML = items.map(({ ev, match }) => {
      const showName = ev.show_type === 'PPV' ? (ev.ppv_name || ev.title) : (ev.title || 'Event');
      const cls = SHOW_CLASS[ev.show_type] || '';
      const rating = match.match_guide_rating != null
        ? `<span class="m-rating"><span class="star" aria-hidden="true">★</span><span class="num">${match.match_guide_rating.toFixed(1)}</span></span>` : '';
      const tags = (match.title_at_stake ? `<span class="m-tag title">${esc(match.title_at_stake)}</span>` : '')
        + (match.stipulation ? `<span class="m-tag stip">${esc(match.stipulation)}</span>` : '');
      const matchup = matchupLabel(match);
      return `
        <button class="saved-row" type="button" data-go-event="${esc(String(ev.id))}" data-go-match="${esc(String(match.id))}">
          <span class="sr-date">${esc(fmtDateLong(ev.air_date))}</span>
          <span class="sr-show"><span class="brand-chip ${cls}">${esc(ev.show_type === 'PPV' ? 'PPV' : ev.show_type)}</span>${esc(showName)}</span>
          <span class="sr-match"><span class="sr-type">${esc(match.match_type || 'Match')}</span>${tags}${rating}</span>
          ${matchup ? `<span class="sr-people">${esc(matchup)}</span>` : ''}
          <span class="sr-remove" data-remove="${esc(savedKey(ev.id, match.id))}" title="Remove from saved" role="button" tabindex="0">Remove</span>
        </button>`;
    }).join('');
    container.querySelectorAll('.saved-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-remove]')) return;
        navigateToEvent(row.getAttribute('data-go-event'), row.getAttribute('data-go-match'));
      });
    });
    container.querySelectorAll('[data-remove]').forEach(rm => {
      const handler = (e) => {
        e.stopPropagation(); e.preventDefault();
        saved.delete(rm.getAttribute('data-remove'));
        persistSaved(); refreshSavedUI(); renderSaved();
      };
      rm.addEventListener('click', handler);
      rm.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') handler(e); });
    });
  }

  // ------------------ Dropdowns -------------------------------------------
  const yr = BUNDLE?.meta?.year_range || [2001, 2004];
  for (let y = yr[0]; y <= yr[1]; y++) {
    const o = document.createElement('option'); o.value = y; o.textContent = y; yearSel.appendChild(o);
  }
  MONTHS.forEach((m, i) => {
    const o = document.createElement('option'); o.value = i + 1; o.textContent = m; monthSel.appendChild(o);
  });
  yearSel.value = yr[0];
  monthSel.value = 1;

  yearSel.addEventListener('change', loadCalendar);
  monthSel.addEventListener('change', loadCalendar);

  const prevBtn = el('month-prev');
  const nextBtn = el('month-next');

  function stepMonth(delta) {
    let y = parseInt(yearSel.value, 10);
    let m = parseInt(monthSel.value, 10) + delta;
    if (m > 12) { m = 1; y += 1; }
    if (m < 1)  { m = 12; y -= 1; }
    if (y < yr[0] || y > yr[1]) return;
    yearSel.value = y;
    monthSel.value = m;
    loadCalendar();
    updateNavButtons();
  }

  function updateNavButtons() {
    const y = parseInt(yearSel.value, 10);
    const m = parseInt(monthSel.value, 10);
    prevBtn.disabled = (y === yr[0] && m === 1);
    nextBtn.disabled = (y === yr[1] && m === 12);
  }

  prevBtn.addEventListener('click', () => stepMonth(-1));
  nextBtn.addEventListener('click', () => stepMonth(1));

  yearSel.addEventListener('change', updateNavButtons);
  monthSel.addEventListener('change', updateNavButtons);

  updateNavButtons();

  // ------------------ Main loader -----------------------------------------
  async function loadCalendar() {
    const year = parseInt(yearSel.value, 10);
    const month = parseInt(monthSel.value, 10);
    monthNameEl.textContent = MONTHS[month - 1];
    monthYearEl.textContent = year;
    rosterMonthEl.textContent = `${MONTHS[month - 1]} ${year}`;
    calEl.innerHTML = '<div class="status">Loading…</div>';
    rosterEl.innerHTML = '<div class="roster-empty">Loading…</div>';

    try {
      const events = await getMonthEvents(year, month);
      monthCountEl.textContent = events.length;

      // Render calendar + hero immediately from summary data (fast path).
      renderCalendar(year, month, events);
      renderHero(events, year, month);

      // Then, in the background, compute the roster from detailed data.
      // This runs after the calendar is already visible, so the user isn't blocked.
      computeAndRenderRoster(year, month, events);
    } catch (err) {
      calEl.innerHTML = `<div class="status">Backend isn't running. Start it with <code>.venv/bin/python -m uvicorn src.api:app --reload</code></div>`;
      rosterEl.innerHTML = '<div class="roster-empty">—</div>';
      heroEl.innerHTML = '';
    }
  }

  // ------------------ Wrestler roster -------------------------------------
  async function computeAndRenderRoster(year, month, summaries) {
    try {
      // Prefer BUNDLE for speed; falls through to per-event fetches otherwise.
      const details = await Promise.all(summaries.map(s => getEventDetail(s.id)));

      // Count matches per wrestler. Each participant in each team in each
      // match on each event counts as one match worked.
      const counts = new Map();
      for (const ev of details) {
        for (const match of (ev.matches || [])) {
          for (const team of (match.teams || [])) {
            const names = (team.participants && team.participants.length)
              ? team.participants
              : (team.team_name ? [team.team_name] : []);
            for (const raw of names) {
              const name = String(raw || '').trim();
              // Skip empty + Cagematch placeholder. Keep this in sync with
              // PLACEHOLDER_NAMES in src/export_to_html.py.
              if (!name || name === '???') continue;
              counts.set(name, (counts.get(name) || 0) + 1);
            }
          }
        }
      }

      const ranked = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 8);

      if (!ranked.length) {
        rosterEl.innerHTML = '<div class="roster-empty">No match data</div>';
        return;
      }

      rosterEl.innerHTML = ranked.map(([name, count], i) => {
        const rank = String(i + 1).padStart(2, '0');
        const slug = (BUNDLE && BUNDLE.wrestlers_by_name && BUNDLE.wrestlers_by_name[name]) || jsSlugify(name);
        return `
          <div class="roster-row${i === 0 ? ' top' : ''}">
            <div class="rank">${rank}</div>
            <div class="name"><button class="wrestler-link" data-slug="${esc(slug)}" title="${esc(name)}">${esc(name)}</button></div>
            <div class="count"><strong>${count}</strong></div>
          </div>`;
      }).join('');
    } catch (err) {
      rosterEl.innerHTML = '<div class="roster-empty">Failed to compute</div>';
    }
  }

  // ------------------ Hero ------------------------------------------------
  function renderHero(events, year, month) {
    const ppv = events.find(e => e.show_type === 'PPV');
    const pick = ppv || events[0];

    if (!pick) {
      heroEl.className = 'hero';
      heroEl.innerHTML = `
        <div class="hero-empty">
          <div class="hero-kicker">Nothing this month</div>
          <div class="hero-title">No events scheduled in ${MONTHS[month-1]} ${year}</div>
        </div>`;
      heroEl.onclick = null;
      return;
    }

    const isPPV = pick.show_type === 'PPV';
    const title = isPPV ? (pick.ppv_name || pick.title) : (pick.title || 'Event');
    const date = new Date(pick.air_date + 'T00:00:00');
    const dayLabel = `${WEEKDAYS[date.getUTCDay()]}, ${MONTHS_SHORT[date.getUTCMonth()]} ${date.getUTCDate()}`;
    const kicker = isPPV ? 'HEADLINE EVENT' : 'WATCH NEXT';
    const chipCls = SHOW_CLASS[pick.show_type];
    const chipLabel = pick.show_type === 'PPV' ? 'Pay-Per-View' : pick.show_type;

    heroEl.className = 'hero' + (isPPV ? ' ppv' : (pick.show_type === 'SmackDown' ? ' smackdown' : ''));
    heroEl.innerHTML = `
      <div class="hero-info">
        <div class="hero-kicker"><span class="pulse"></span>${kicker}</div>
        <div class="hero-title">${esc(title)}</div>
        <div class="hero-meta">
          <span class="chip ${chipCls}">${esc(chipLabel)}</span>
          <span>${esc(dayLabel)}</span>
          <span class="dot"></span>
          <span>${pick.match_count} matches</span>
        </div>
      </div>
      <button class="hero-cta">
        <span>Open card</span>
        <span class="arrow">→</span>
      </button>
    `;
    heroEl.onclick = () => openModalForDate(events, pick.air_date);
    heroEl.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModalForDate(events, pick.air_date); } };
  }

  function openModalForDate(events, iso) {
    const dayEvents = events.filter(e => e.air_date === iso);
    if (dayEvents.length) openModal(dayEvents, iso);
  }

  // ------------------ Calendar --------------------------------------------
  function renderCalendar(year, month, events) {
    const byDate = {};
    for (const e of events) (byDate[e.air_date] = byDate[e.air_date] || []).push(e);

    const firstDOW = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
    const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const prevMonthLast = new Date(Date.UTC(year, month - 1, 0)).getUTCDate();

    const cells = [];
    for (let i = firstDOW; i > 0; i--) cells.push({ day: prevMonthLast - i + 1, other: true });
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day: d, other: false, iso, events: byDate[iso] || [] });
    }
    let nextDay = 1;
    while (cells.length % 7 !== 0) cells.push({ day: nextDay++, other: true });

    calEl.innerHTML = '';
    cells.forEach((c, idx) => {
      const div = document.createElement('div');
      const hasEvents = !c.other && c.events && c.events.length > 0;
      const hasPPV = hasEvents && c.events.some(e => e.show_type === 'PPV');

      div.className = 'day'
        + (c.other ? ' other-month' : '')
        + (!c.other && !hasEvents ? ' empty' : '')
        + (hasEvents ? ' has-events' : '')
        + (hasPPV ? ' has-ppv' : '');
      div.style.setProperty('--i', idx);
      if (!c.other) div.dataset.iso = c.iso;

      const wdLabel = !c.other ? WEEKDAYS[idx % 7].slice(0, 2) : '';
      div.innerHTML = `
        <div class="date-row">
          <div class="date">${c.day}</div>
          ${hasEvents ? `<div class="weekday-tiny">${wdLabel}</div>` : ''}
        </div>
      `;

      if (hasEvents) {
        const markers = document.createElement('div');
        markers.className = 'day-markers';
        for (const ev of c.events) {
          const m = document.createElement('div');
          const cls = SHOW_CLASS[ev.show_type] || '';
          m.className = `mini-chip ${cls}`;
          m.dataset.eventId = ev.id;
          let label;
          if (ev.show_type === 'PPV') label = (ev.ppv_name || 'PPV').replace(/^WW[EF]\s+/, '');
          else if (ev.show_type === 'Raw') label = 'Raw';
          else label = 'SmackDown';
          m.innerHTML = `<span class="label">${esc(label)}</span><span class="ct">${ev.match_count}</span>`;
          markers.appendChild(m);
        }
        div.appendChild(markers);
        div.addEventListener('click', () => openModal(c.events, c.iso));
      }
      calEl.appendChild(div);
    });
    markBookmarkedDay();
    markWatchedChips();
  }

  // ------------------ Modal -----------------------------------------------
  async function openModal(events, iso, sourceSlug = null, scrollMatchId = null) {
    mContent.innerHTML = '<div class="status">Loading…</div>';
    mBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (mEl) mEl.scrollTop = 0;
    try {
      const details = await Promise.all(events.map(e => getEventDetail(e.id)));
      mContent.innerHTML = details.map(d => renderEvent(d, sourceSlug)).join('');
      // Defer stagger index assignment so first paint isn't blocked.
      requestAnimationFrame(() => {
        mContent.querySelectorAll('.match-card').forEach((m, i) => m.style.setProperty('--match-index', i));
        if (sourceSlug && mEl) {
          // .modal is the scrolling element. Center the source wrestler-link
          // inside its viewport so the user lands on the relevant match.
          const target = mContent.querySelector('.wrestler-link.source');
          if (target) {
            const rect = target.getBoundingClientRect();
            const modalRect = mEl.getBoundingClientRect();
            const targetTop = rect.top - modalRect.top + mEl.scrollTop;
            const desired = targetTop - mEl.clientHeight / 2 + rect.height / 2;
            mEl.scrollTo({ top: Math.max(0, desired), behavior: 'smooth' });
          }
        }
        if (scrollMatchId && mEl) {
          const card = mContent.querySelector(`.match-card[data-match-id="${scrollMatchId}"]`);
          if (card) {
            const rect = card.getBoundingClientRect();
            const modalRect = mEl.getBoundingClientRect();
            const desired = rect.top - modalRect.top + mEl.scrollTop - 16;
            mEl.scrollTo({ top: Math.max(0, desired), behavior: 'smooth' });
            card.classList.add('flash');
            setTimeout(() => card.classList.remove('flash'), 1600);
          }
        }
      });
      // Wire up details toggles via delegation on mContent would be simpler,
      // but direct binding is fine for the ~12 matches on a typical PPV card.
      mContent.querySelectorAll('[data-toggle-details]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const card = btn.closest('.match-card');
          if (!card) return;
          const open = card.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });
      // Bookmark toggles, one per event hero in this modal.
      mContent.querySelectorAll('[data-bookmark-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBookmark(btn.getAttribute('data-bookmark-id'));
        });
      });
      // Watched toggles, one per event hero.
      mContent.querySelectorAll('[data-watched-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWatched(btn.getAttribute('data-watched-id'));
        });
      });
      // Save toggles, one per match.
      mContent.querySelectorAll('[data-save-match]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSaved(btn.getAttribute('data-save-event'), btn.getAttribute('data-save-match'));
        });
      });
      refreshBookmarkUI();
      refreshWatchedUI();
      refreshSavedUI();
    } catch (err) {
      mContent.innerHTML = '<div class="status">Couldn\'t load that event.</div>';
    }
  }

  function closeModal() {
    mBackdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
  el('modal-close').addEventListener('click', closeModal);
  mBackdrop.addEventListener('click', (e) => { if (e.target === mBackdrop) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  function buildMeta(d) {
    const bits = [];
    if (d.venue) bits.push(esc(d.venue));
    if (d.city) bits.push(esc(d.city));
    if (d.attendance) bits.push(`${d.attendance.toLocaleString()} fans`);
    if (d.tape_date && d.tape_date !== d.air_date) bits.push(`Taped ${esc(d.tape_date)}`);
    if (d.tv_network) bits.push(esc(d.tv_network));
    if (d.commentary) bits.push(`Call: ${esc(d.commentary)}`);
    return bits.map(b => `<span class="piece">${b}</span>`).join('');
  }

  function renderEvent(d, sourceSlug = null) {
    const showType = d.show_type;
    const cls = SHOW_CLASS[showType] || '';
    const isPPV = showType === 'PPV';
    const title = isPPV ? (d.ppv_name || d.title) : (d.title || 'Event');
    const chipLabel = isPPV ? 'Pay-Per-View' : showType;
    const meta = buildMeta(d);
    const subtitle = isPPV && d.title && d.title !== (d.ppv_name || '') ? d.title : '';
    const bmId = esc(String(d.id || ''));
    const isBm = d.id != null && String(d.id) === String(bookmarkId || '');
    const isW = d.id != null && watched.has(String(d.id));

    return `
      <div class="event-block" data-event-id="${bmId}" data-event-date="${esc(d.air_date || '')}" data-event-name="${esc(title || '')}">
        <div class="event-hero ${cls}">
          <div class="event-hero-top">
            <span class="brand-chip ${cls}">${esc(chipLabel)}</span>
            <div class="event-hero-actions">
              <button class="watched-btn${isW ? ' active' : ''}" data-watched-id="${bmId}" type="button" aria-pressed="${isW ? 'true' : 'false'}" title="${isW ? 'Mark as not watched' : 'Mark this show watched'}">
                <span class="wb-check" aria-hidden="true"></span>
                <span class="wb-label">${isW ? 'Watched' : 'Mark watched'}</span>
              </button>
              <button class="bookmark-btn${isBm ? ' active' : ''}" data-bookmark-id="${bmId}" type="button" aria-pressed="${isBm ? 'true' : 'false'}" title="${isBm ? 'This is your resume point. Click to clear.' : 'Set this show as your resume point'}">
                <span class="bm-pin" aria-hidden="true"></span>
                <span class="bm-label">${isBm ? 'Resume point' : 'Resume here'}</span>
              </button>
            </div>
          </div>
          <h3 class="event-title-modal">${esc(title)}</h3>
          ${subtitle ? `<div class="event-meta-modal"><span class="piece">${esc(subtitle)}</span></div>` : ''}
          ${meta ? `<div class="event-meta-modal">${meta}</div>` : ''}
        </div>
        <div class="matches-list">
          ${(d.matches || []).map(m => renderMatch(m, d.air_date, sourceSlug, d.id)).join('') || '<div class="status">No match list recorded.</div>'}
        </div>
      </div>
    `;
  }

  function renderMatch(m, airDate, sourceSlug = null, eventId = null) {
    const order = String(m.match_order).padStart(2, '0');
    const type = m.match_type || 'Match';
    const titleTag = m.title_at_stake ? `<span class="m-tag title">${esc(m.title_at_stake)}</span>` : '';
    const stipTag = m.stipulation ? `<span class="m-tag stip">${esc(m.stipulation)}</span>` : '';
    // Rating is NOT a spoiler: surfaced unconditionally so spoiler-hidden users
    // can still triage which matches are worth watching.
    const ratingTag = m.match_guide_rating != null
      ? `<span class="m-rating" title="Cagematch Match Guide rating"><span class="star" aria-hidden="true">★</span><span class="num">${m.match_guide_rating.toFixed(1)}</span></span>`
      : '';
    const hasDetails = Boolean(m.raw_description) || m.match_guide_rating != null;
    const detailsToggle = hasDetails
      ? `<button class="details-toggle" data-toggle-details type="button" aria-expanded="false">Details<span class="chev"></span></button>`
      : '';
    const canSave = eventId != null && m.id != null;
    const isS = canSave && saved.has(savedKey(eventId, m.id));
    const saveBtn = canSave
      ? `<button class="save-btn${isS ? ' active' : ''}" data-save-event="${esc(String(eventId))}" data-save-match="${esc(String(m.id))}" type="button" aria-pressed="${isS ? 'true' : 'false'}" title="${isS ? 'Saved. Click to remove.' : 'Save this match'}"><span class="sv-ribbon" aria-hidden="true"></span><span class="sv-label">${isS ? 'Saved' : 'Save'}</span></button>`
      : '';
    return `
      <div class="match-card"${canSave ? ` data-match-id="${esc(String(m.id))}"` : ''}>
        <div class="match-header-row">
          <span class="m-number">M${order}</span>
          <span class="m-type">${esc(type)}</span>
          ${titleTag}${stipTag}${ratingTag}
          ${detailsToggle}
          ${saveBtn}
        </div>
        ${renderMatchBody(m, airDate, sourceSlug)}
        ${renderMatchFooter(m)}
        ${renderMatchDetails(m)}
      </div>
    `;
  }

  function renderRating(rating) {
    // rating scale is 0-10. Render as 5 stars with red fill proportional to rating/10.
    const pct = Math.max(0, Math.min(100, (rating / 10) * 100));
    return `
      <span class="rating">
        <span class="stars" aria-hidden="true">
          <span class="stars-fill" style="width: ${pct.toFixed(1)}%"></span>
        </span>
        <span class="rating-num">${rating.toFixed(2)}</span>
        <span class="rating-scale">/ 10</span>
      </span>`;
  }

  function renderMatchDetails(m) {
    const hasRaw = Boolean(m.raw_description);
    const hasRating = m.match_guide_rating != null;
    if (!hasRaw && !hasRating) return '';

    const rows = [];
    if (hasRating) {
      rows.push(`
        <div class="details-row">
          <span class="label">Rating</span>
          <span class="value spoilery">${renderRating(m.match_guide_rating)}</span>
        </div>`);
    }
    if (hasRaw) {
      rows.push(`
        <div class="details-row">
          <span class="label">Report</span>
          <span class="value mono spoilery">${esc(m.raw_description)}</span>
        </div>`);
    }
    return `
      <div class="details-panel">
        <div class="details-inner">
          ${rows.join('')}
        </div>
      </div>`;
  }

  function renderTeam(t, side, cls = '', airDate = null, titleAtStake = null, sourceSlug = null) {
    const rawNames = (t.participants && t.participants.length ? t.participants : [t.team_name]).filter(Boolean);
    const plainNames = rawNames.map(String).join(' & ');
    const linkedNames = rawNames.map(n => {
      // Keep this list in sync with PLACEHOLDER_NAMES in src/export_to_html.py.
      if (n === '???') return esc(n);
      const slug = (BUNDLE && BUNDLE.wrestlers_by_name && BUNDLE.wrestlers_by_name[n]) || jsSlugify(n);
      const linkClass = sourceSlug && slug === sourceSlug ? 'wrestler-link source' : 'wrestler-link';
      return `<button class="${linkClass}" data-slug="${esc(slug)}">${esc(n)}</button>`;
    }).join(' &amp; ');
    let champ = '';
    if (t.was_champion_entering) {
      const tip = titleAtStake ? ` title="${esc(titleAtStake)}"` : '';
      champ = `<span class="champ-badge"${tip}>Champ</span>`;
    } else if (airDate) {
      const heldTitles = new Set();
      for (const n of rawNames) {
        for (const tt of titlesHeldOn(n, airDate)) heldTitles.add(tt);
      }
      if (heldTitles.size > 0) {
        champ = `<span class="champ-badge" title="${esc([...heldTitles].join(', '))}">Champ</span>`;
      }
    }
    const metaBits = [];
    if (t.accompaniment) metaBits.push(`w/ ${esc(t.accompaniment)}`);
    if (t.team_name && t.participants && t.participants.length > 1 &&
        canonTeamLabel(t.team_name) !== canonTeamLabel(plainNames)) {
      metaBits.push(`as ${esc(t.team_name)}`);
    }
    const metaRow = metaBits.length ? `<span class="team-meta">${metaBits.join(' · ')}</span>` : '';
    return `<div class="team ${side} ${cls}"><span class="team-names">${linkedNames}${champ}</span>${metaRow}</div>`;
  }

  function shouldSwapTeams(m) {
    return ((m.id || m.match_order || 0) % 2) === 1;
  }

  function renderMatchBody(m, airDate, sourceSlug = null) {
    const teams = m.teams || [];
    if (!teams.length) return `<div class="match-body"><em style="color:var(--ink-faint);">No details</em></div>`;
    const titleAtStake = m.title_at_stake || null;

    // Battle royals / Royal Rumbles cram dozens of names into a single team and
    // collapse the inline two-column rendering into an unreadable wall. Switch
    // the whole match to a winner-prominent stacked layout when any team grows
    // past 8 participants.
    if (teams.some(t => (t.participants || []).length >= 8)) {
      return renderStackedBody(teams, airDate, titleAtStake, sourceSlug);
    }

    if (teams.length === 2) {
      const [a, b] = shouldSwapTeams(m) ? [teams[1], teams[0]] : teams;
      const anyOutcome = (o) => teams.some(t => t.match_outcome === o);
      const noResult = anyOutcome('no-contest') || anyOutcome('draw') || (a.was_winner !== true && b.was_winner !== true);
      const winnerSide = noResult ? null : (a.was_winner === true ? 'left' : 'right');
      const leftCls = winnerSide === 'left' ? 'winner' : winnerSide === 'right' ? 'loser' : '';
      const rightCls = winnerSide === 'right' ? 'winner' : winnerSide === 'left' ? 'loser' : '';
      const arrow = winnerSide === 'left' ? '<span class="def-arrow">←</span> DEF'
        : winnerSide === 'right' ? 'DEF <span class="def-arrow">→</span>'
        : 'DEF';
      return `
        <div class="match-body">
          ${renderTeam(a, 'left', leftCls, airDate, titleAtStake, sourceSlug)}
          <div class="vs-cell">
            <span class="vs-text">VS</span>
            <span class="def-text">${arrow}</span>
          </div>
          ${renderTeam(b, 'right', rightCls, airDate, titleAtStake, sourceSlug)}
        </div>`;
    }

    const parts = [];
    teams.forEach((t, i) => {
      const win = t.was_winner === true;
      const cls = win ? 'winner' : (teams.some(x => x.was_winner === true) ? 'loser' : '');
      parts.push(renderTeam(t, 'left', cls, airDate, titleAtStake, sourceSlug));
      if (i < teams.length - 1) parts.push('<div class="multi-divider">vs</div>');
    });
    return `<div class="match-body multi">${parts.join('')}</div>`;
  }

  function renderStackedBody(teams, airDate, titleAtStake, sourceSlug) {
    const winners = teams.filter(t => t.was_winner === true);
    const others = teams.filter(t => t.was_winner !== true);
    const anyOutcome = (o) => teams.some(t => t.match_outcome === o);
    const noResult = anyOutcome('no-contest') || anyOutcome('draw') || winners.length === 0;

    const blocks = [];
    if (noResult) {
      const combined = teams.flatMap(t => (t.participants || []).filter(Boolean));
      const pseudoTeam = { participants: combined };
      blocks.push(renderTeamBlock(pseudoTeam, 'field', 'FIELD', airDate, titleAtStake, sourceSlug));
    } else {
      const winnerSolo = winners.length === 1 && (winners[0].participants || []).length === 1;
      for (const w of winners) {
        const wSize = (w.participants || []).length;
        blocks.push(renderTeamBlock(w, 'winner', wSize === 1 ? 'WINNER' : 'WINNERS', airDate, titleAtStake, sourceSlug));
      }
      for (const l of others) {
        const role = winnerSolo ? 'field' : 'defeated';
        const label = winnerSolo ? 'FIELD' : 'DEFEATED';
        blocks.push(renderTeamBlock(l, role, label, airDate, titleAtStake, sourceSlug));
      }
    }
    return `<div class="match-body stacked">${blocks.join('<div class="stacked-divider"></div>')}</div>`;
  }

  function renderTeamBlock(t, role, label, airDate, titleAtStake, sourceSlug) {
    const rawNames = (t.participants && t.participants.length ? t.participants : [t.team_name]).filter(Boolean);
    const plainNames = rawNames.map(String).join(' & ');
    const linkFor = (n) => {
      if (n === '???') return esc(n);
      const slug = (BUNDLE && BUNDLE.wrestlers_by_name && BUNDLE.wrestlers_by_name[n]) || jsSlugify(n);
      const linkClass = sourceSlug && slug === sourceSlug ? 'wrestler-link source' : 'wrestler-link';
      return `<button class="${linkClass}" data-slug="${esc(slug)}">${esc(n)}</button>`;
    };

    let champ = '';
    if (t.was_champion_entering) {
      const tip = titleAtStake ? ` title="${esc(titleAtStake)}"` : '';
      champ = `<span class="champ-badge"${tip}>Champ</span>`;
    } else if (airDate) {
      const heldTitles = new Set();
      for (const n of rawNames) {
        for (const tt of titlesHeldOn(n, airDate)) heldTitles.add(tt);
      }
      if (heldTitles.size > 0) {
        champ = `<span class="champ-badge" title="${esc([...heldTitles].join(', '))}">Champ</span>`;
      }
    }

    let namesHtml;
    if (rawNames.length === 1) {
      namesHtml = `<div class="team-block-banner">${linkFor(rawNames[0])}${champ}</div>`;
    } else {
      const grid = `<div class="team-block-grid">${rawNames.map(linkFor).join('')}</div>`;
      namesHtml = champ ? `${grid}<div class="team-block-badges">${champ}</div>` : grid;
    }

    const metaBits = [];
    if (t.accompaniment) metaBits.push(`w/ ${esc(t.accompaniment)}`);
    if (t.team_name && t.participants && t.participants.length > 1 &&
        canonTeamLabel(t.team_name) !== canonTeamLabel(plainNames)) {
      metaBits.push(`as ${esc(t.team_name)}`);
    }
    const metaRow = metaBits.length ? `<div class="team-block-meta">${metaBits.join(' · ')}</div>` : '';

    const mask = role === 'winner'
      ? `<div class="team-block-mask" aria-hidden="true">—</div>`
      : '';

    return `
      <div class="team-block ${role}">
        ${mask}
        <div class="team-block-header">${esc(label)}</div>
        ${namesHtml}
        ${metaRow}
      </div>`;
  }

  function renderMatchFooter(m) {
    const bits = [];
    const dur = fmtDuration(m.duration_seconds);
    if (dur) bits.push(`<span class="duration">${dur}</span>`);
    const teams = m.teams || [];
    const anyOutcome = (o) => teams.some(t => t.match_outcome === o);
    if (anyOutcome('no-contest')) bits.push(`<span class="outcome-flag nc">No Contest</span>`);
    else if (anyOutcome('draw')) bits.push(`<span class="outcome-flag draw">Draw</span>`);
    else if (anyOutcome('dq-win')) bits.push(`<span class="outcome-flag dq">By DQ</span>`);
    else if (anyOutcome('countout-win')) bits.push(`<span class="outcome-flag co">By Count-out</span>`);
    if (!bits.length) return '';
    return `<div class="match-footer">${bits.join('')}</div>`;
  }

  // ------------------------------------------------------------------
  // Title-reign lookup (Phase 1b)
  // ------------------------------------------------------------------
  function titlesHeldOn(name, date) {
    if (!name || !date || !BUNDLE || !BUNDLE.wrestler_reigns_by_date) return [];
    const intervals = BUNDLE.wrestler_reigns_by_date[name] || [];
    return intervals
      .filter(iv => iv.start <= date && (iv.end === null || iv.end > date))
      .map(iv => iv.title);
  }

  // ------------------------------------------------------------------
  // Slug helper (mirrors Python slugify for fallback name lookups)
  // ------------------------------------------------------------------
  function jsSlugify(name) {
    return String(name).toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/[\s-]+/g, '-')
      .replace(/^-|-$/g, '') || 'unknown';
  }

  // ------------------------------------------------------------------
  // Tooltip (hover devices only)
  // ------------------------------------------------------------------
  const tooltipEl = document.getElementById('wrestler-tooltip');
  const hasHover = window.matchMedia('(hover: hover)').matches;
  let tooltipTimer = null;

  function positionTooltip(anchor) {
    if (!anchor || !tooltipEl) return;
    const rect = anchor.getBoundingClientRect();
    const tw = tooltipEl.offsetWidth || 240;
    const th = tooltipEl.offsetHeight || 160;
    let left = rect.left;
    let top = rect.bottom + 8;
    if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
    if (left < 8) left = 8;
    if (top + th > window.innerHeight - 8) top = rect.top - th - 8;
    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }

  function showTooltip(slug, anchor) {
    if (!hasHover || !tooltipEl) return;
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => {
      const w = BUNDLE && BUNDLE.wrestlers && BUNDLE.wrestlers[slug];
      if (!w) return;
      const dateEl = anchor.closest('[data-event-date]');
      const eventDate = dateEl ? dateEl.dataset.eventDate : null;
      const heldTitles = eventDate ? titlesHeldOn(w.name, eventDate) : [];
      const yr = w.active_years[0] === w.active_years[1]
        ? String(w.active_years[0])
        : `${w.active_years[0]}-${w.active_years[1]}`;
      tooltipEl.innerHTML = `
        <div class="tt-name">${esc(w.name)}</div>
        <div class="tt-row"><span>Active</span><span class="tt-val">${esc(yr)}</span></div>
        <div class="tt-row"><span>Matches</span><span class="tt-val">${w.total_matches}</span></div>
        <div class="tt-row"><span>Record</span><span class="tt-val">${w.wins}W-${w.losses}L</span></div>
        ${w.win_pct != null ? `<div class="tt-row"><span>Win %</span><span class="tt-val">${w.win_pct}%</span></div>` : ''}
        ${heldTitles.length ? `<div class="tt-row"><span>Held at this time</span><span class="tt-val" style="max-width:160px;font-size:10px;">${esc(heldTitles.join(', '))}</span></div>` : ''}
      `;
      positionTooltip(anchor);
      tooltipEl.classList.add('visible');
      tooltipEl.setAttribute('aria-hidden', 'false');
    }, 150);
  }

  function hideTooltip() {
    clearTimeout(tooltipTimer);
    if (tooltipEl) {
      tooltipEl.classList.remove('visible');
      tooltipEl.setAttribute('aria-hidden', 'true');
    }
  }

  // ------------------------------------------------------------------
  // Wrestler-link: document-level click + hover delegation
  // ------------------------------------------------------------------
  // wrestlerSource tracks where the user came from when navigating into
  // a wrestler profile. Set on wrestler-link clicks from inside the event
  // modal; chained when clicking from one profile to another. Cleared on
  // tab navigation or when clicking from outside the modal/profile.
  let wrestlerSource = null;

  function getCurrentWrestlerSlug() {
    const h = window.location.hash;
    return h.startsWith('#wrestler/') ? decodeURIComponent(h.slice('#wrestler/'.length)) : null;
  }

  function captureWrestlerSource(btn) {
    if (btn.closest('#modal-content')) {
      const eventBlock = btn.closest('.event-block');
      if (eventBlock && eventBlock.dataset.eventId) {
        wrestlerSource = {
          event_id: eventBlock.dataset.eventId,
          event_date: eventBlock.dataset.eventDate || '',
          event_name: eventBlock.dataset.eventName || '',
          chain: [],
        };
        return;
      }
    }
    if (btn.closest('#wrestler-profile-content') && wrestlerSource) {
      const cur = getCurrentWrestlerSlug();
      if (cur) {
        const w = (BUNDLE && BUNDLE.wrestlers && BUNDLE.wrestlers[cur]) || null;
        const name = (w && w.name) || cur;
        const chain = (wrestlerSource.chain || []).slice();
        if (chain.length === 0 || chain[chain.length - 1].slug !== cur) {
          chain.push({ slug: cur, name });
        }
        wrestlerSource = Object.assign({}, wrestlerSource, { chain });
      }
      return;
    }
    // From sidebar roster, roster table, breadcrumb back-references, or anywhere
    // else. The rendered wrestler-link breadcrumb crumbs land here too, which is
    // fine: they navigate via the same hash change and renderWrestler then
    // truncates the chain at the matching slug.
    if (!btn.closest('#wrestler-profile-content')) {
      wrestlerSource = null;
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button.wrestler-link');
    if (!btn || !btn.dataset.slug) return;
    captureWrestlerSource(btn);
    closeModal();
    window.location.hash = '#wrestler/' + btn.dataset.slug;
  });

  document.addEventListener('mouseover', (e) => {
    const btn = e.target.closest('button.wrestler-link');
    if (btn && btn.dataset.slug) showTooltip(btn.dataset.slug, btn);
  });

  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('button.wrestler-link')) hideTooltip();
  });

  // Defensive cleanup: hide tooltip on any state change that could orphan it.
  // Scroll, navigation, tab blur, and clicks elsewhere all dismiss the anchor
  // without firing mouseout on the original button.
  window.addEventListener('scroll', hideTooltip, { passive: true, capture: true });
  window.addEventListener('hashchange', hideTooltip);
  window.addEventListener('blur', hideTooltip);
  document.addEventListener('click', hideTooltip);

  // ------------------------------------------------------------------
  // Roster render
  // ------------------------------------------------------------------
  let rosterBuilt = false;

  function renderRoster() {
    if (!BUNDLE || !BUNDLE.wrestlers) return;
    const container = document.getElementById('roster-view-content');
    if (!container || rosterBuilt) return;
    rosterBuilt = true;

    const all = Object.values(BUNDLE.wrestlers);
    all.sort((a, b) => a.name.localeCompare(b.name));

    container.innerHTML = `
      <table class="roster-table">
        <thead>
          <tr>
            <th class="rt-rank">#</th>
            <th>Name</th>
            <th>Matches</th>
            <th>PPV</th>
            <th>Shows</th>
            <th>Active</th>
          </tr>
        </thead>
        <tbody id="roster-tbody">${buildRosterRows(all)}</tbody>
      </table>`;

    const searchEl = document.getElementById('roster-search');
    const sortEl = document.getElementById('roster-sort');

    function applyFilterSort() {
      const q = searchEl.value.toLowerCase().trim();
      const key = sortEl.value;
      let rows = q ? all.filter(w => w.name.toLowerCase().includes(q)) : all.slice();
      if (key === 'matches') rows.sort((a, b) => b.total_matches - a.total_matches);
      else if (key === 'ppv')  rows.sort((a, b) => b.ppv_appearances - a.ppv_appearances);
      else if (key === 'shows') rows.sort((a, b) => b.unique_event_count - a.unique_event_count);
      else rows.sort((a, b) => a.name.localeCompare(b.name));
      const tbody = document.getElementById('roster-tbody');
      if (!tbody) return;
      tbody.innerHTML = rows.length
        ? buildRosterRows(rows)
        : `<tr><td colspan="6" class="roster-no-results">No results for "${esc(q)}"</td></tr>`;
    }

    searchEl.addEventListener('input', applyFilterSort);
    sortEl.addEventListener('change', applyFilterSort);
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-slug]');
      if (btn) window.location.hash = '#wrestler/' + btn.dataset.slug;
    });
  }

  function buildRosterRows(wrestlers) {
    return wrestlers.map((w, i) => {
      const yr = w.active_years[0] === w.active_years[1]
        ? w.active_years[0]
        : `${w.active_years[0]}-${w.active_years[1]}`;
      return `<tr>
        <td class="rt-rank">${i + 1}</td>
        <td class="rt-name"><button class="wrestler-link" data-slug="${esc(w.slug)}">${esc(w.name)}</button></td>
        <td class="rt-num">${w.total_matches}</td>
        <td class="rt-num">${w.ppv_appearances}</td>
        <td class="rt-num">${w.unique_event_count}</td>
        <td class="rt-years">${yr}</td>
      </tr>`;
    }).join('');
  }

  // ------------------------------------------------------------------
  // Wrestler profile render
  // ------------------------------------------------------------------
  function buildWrestlerNav(slug, w) {
    // Returns { breadcrumbHtml, backBtnHtml, backEvent }. Uses wrestlerSource
    // (set by wrestler-link click delegation) to know whether the user arrived
    // from an event modal or from the roster.
    if (
      wrestlerSource &&
      wrestlerSource.event_id &&
      BUNDLE && BUNDLE.events && BUNDLE.events[wrestlerSource.event_id]
    ) {
      // Truncate chain at the slug being rendered so back-navigation through
      // breadcrumbs leaves the chain consistent (predecessors only).
      const chain = (wrestlerSource.chain || []).slice();
      const idx = chain.findIndex(c => c.slug === slug);
      if (idx >= 0) chain.length = idx;
      wrestlerSource = Object.assign({}, wrestlerSource, { chain });

      const ev = BUNDLE.events[wrestlerSource.event_id];
      const date = ev.air_date || wrestlerSource.event_date || '';
      const yPart = date.slice(0, 4);
      const mPart = parseInt(date.slice(5, 7), 10);
      const monthYear = (mPart >= 1 && mPart <= 12 && yPart)
        ? `${MONTHS[mPart - 1]} ${yPart}`
        : '';
      const eventName = wrestlerSource.event_name || ev.ppv_name || ev.title || 'Event';

      const crumbs = [];
      crumbs.push(`<button type="button" class="crumb" data-bc="calendar">Calendar</button>`);
      if (monthYear) {
        crumbs.push(`<button type="button" class="crumb" data-bc="month" data-y="${esc(yPart)}" data-m="${mPart}">${esc(monthYear)}</button>`);
      }
      crumbs.push(`<button type="button" class="crumb" data-bc="event" data-event-id="${esc(String(wrestlerSource.event_id))}" title="${esc(eventName)}">${esc(eventName)}</button>`);
      for (const c of chain) {
        crumbs.push(`<button type="button" class="crumb wrestler-link" data-slug="${esc(c.slug)}">${esc(c.name)}</button>`);
      }
      crumbs.push(`<span class="crumb current">${esc(w.name)}</span>`);

      const breadcrumbHtml = `<nav class="breadcrumbs" aria-label="Breadcrumb">${crumbs.join('<span class="crumb-sep" aria-hidden="true">›</span>')}</nav>`;
      const backBtnHtml = `<button type="button" class="profile-back-btn" id="profile-back-btn" data-back-event="${esc(String(wrestlerSource.event_id))}"><span class="pb-arrow">&#8592;</span><span class="pb-label">Back to ${esc(eventName)}</span></button>`;
      return { breadcrumbHtml, backBtnHtml, backEvent: wrestlerSource.event_id };
    }
    return {
      breadcrumbHtml: '',
      backBtnHtml: `<button type="button" class="profile-back" id="profile-back-btn">&#8592; Roster</button>`,
      backEvent: null,
    };
  }

  function navigateToEvent(eventId, matchId = null) {
    const ev = BUNDLE && BUNDLE.events && BUNDLE.events[String(eventId)];
    if (!ev) {
      window.location.hash = '#calendar';
      return;
    }
    const [y, m] = (ev.air_date || '').split('-');
    if (y && m) {
      yearSel.value = y;
      monthSel.value = parseInt(m, 10);
    }
    const onCalendar = window.location.hash === '' || window.location.hash === '#calendar';
    window.location.hash = '#calendar';
    // route() rerenders the calendar view; wait one frame so the view is mounted.
    requestAnimationFrame(() => {
      loadCalendar();
      requestAnimationFrame(() => openModal([ev], ev.air_date, null, matchId));
    });
    if (onCalendar) {
      // hashchange won't fire if hash is unchanged, force route + load + open.
      route();
    }
  }

  function navigateToMonth(year, month) {
    yearSel.value = String(year);
    monthSel.value = String(month);
    const onCalendar = window.location.hash === '' || window.location.hash === '#calendar';
    window.location.hash = '#calendar';
    if (onCalendar) {
      route();
      loadCalendar();
    }
  }

  function renderWrestler(slug) {
    const container = document.getElementById('wrestler-profile-content');
    if (!container) return;
    const w = BUNDLE && BUNDLE.wrestlers && BUNDLE.wrestlers[slug];
    if (!w) {
      container.innerHTML = `<div class="status">Wrestler not found: ${esc(slug)}</div>`;
      return;
    }
    const nav = buildWrestlerNav(slug, w);

    const yr = w.active_years[0] === w.active_years[1]
      ? String(w.active_years[0])
      : `${w.active_years[0]} - ${w.active_years[1]}`;

    const titleHtml = w.title_wins && w.title_wins.length
      ? `<div class="title-list">${w.title_wins.map(([t, cnt], i) =>
          `<div class="title-row${i === 0 ? ' sig' : ''}">
            <span class="title-name">${esc(t)}</span>
            <span class="title-count">x${cnt}</span>
          </div>`).join('')}</div>`
      : '<div class="roster-no-results">No title wins recorded.</div>';

    const rivalHtml = w.top_rivalries && w.top_rivalries.length
      ? `<div class="rivalry-list">${w.top_rivalries.map(([oSlug, oName, cnt]) =>
          `<div class="rivalry-row">
            <button class="wrestler-link" data-slug="${esc(oSlug)}">${esc(oName)}</button>
            <span class="rv-count">${cnt} matches</span>
          </div>`).join('')}</div>`
      : '<div class="roster-no-results">No rivalry data.</div>';

    const partnerHtml = w.top_tag_partners && w.top_tag_partners.length
      ? `<div class="partner-list">${w.top_tag_partners.map(([pSlug, pName, cnt]) =>
          `<div class="partner-row">
            <button class="wrestler-link" data-slug="${esc(pSlug)}">${esc(pName)}</button>
            <span class="pn-count">${cnt} matches</span>
          </div>`).join('')}</div>`
      : '<div class="roster-no-results">No tag partner data.</div>';

    let longestHtml = '<div class="roster-no-results">No duration data.</div>';
    if (w.longest_match) {
      const lm = w.longest_match;
      longestHtml = `
        <div class="signature-match">
          <div class="sm-duration">● ${fmtDuration(lm.duration_seconds)}</div>
          <div>
            <button class="sm-event-link" data-event-id="${lm.event_id}">${esc(lm.event_name || lm.event_date)}</button>
            <span style="color:var(--ink-faint);font-family:var(--font-mono);font-size:11px;margin-left:8px;">${esc(lm.event_date)}</span>
          </div>
          ${lm.description ? `<div class="sm-desc">${esc(lm.description.slice(0, 220))}${lm.description.length > 220 ? '…' : ''}</div>` : ''}
        </div>`;
    }

    let recentHtml = '<div class="roster-no-results">No events.</div>';
    if (w.recent_event_ids && w.recent_event_ids.length) {
      const rows = w.recent_event_ids.map(eid => {
        const ev = BUNDLE.events[String(eid)];
        if (!ev) return '';
        const evTitle = ev.show_type === 'PPV' ? (ev.ppv_name || ev.title) : (ev.title || 'Event');
        return `<div class="recent-event-row">
          <button class="recent-event-link" data-event-id="${eid}">${esc(evTitle)}</button>
          <span class="re-date">${esc(ev.air_date)}</span>
        </div>`;
      }).filter(Boolean).join('');
      if (rows) recentHtml = `<div class="recent-events-list">${rows}</div>`;
    }

    container.innerHTML = `
      ${nav.breadcrumbHtml}
      ${nav.backBtnHtml}

      <div class="profile-header">
        <div class="profile-name">${esc(w.name)}</div>
        <div class="profile-years">${esc(yr)}</div>
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Career Record</div>
        <div class="record-grid">
          <div class="record-stat"><div class="rs-label">Matches</div><div class="rs-value">${w.total_matches}</div></div>
          <div class="record-stat"><div class="rs-label">Shows</div><div class="rs-value">${w.unique_event_count}</div></div>
          <div class="record-stat wins"><div class="rs-label">Wins</div><div class="rs-value">${w.wins}</div></div>
          <div class="record-stat"><div class="rs-label">Losses</div><div class="rs-value">${w.losses}</div></div>
          <div class="record-stat"><div class="rs-label">Win %</div><div class="rs-value">${w.win_pct != null ? w.win_pct + '%' : '-'}</div></div>
          <div class="record-stat"><div class="rs-label">PPV</div><div class="rs-value">${w.ppv_appearances}</div></div>
          <div class="record-stat"><div class="rs-label">Main Events</div><div class="rs-value">${w.main_events}</div></div>
          ${w.draws ? `<div class="record-stat"><div class="rs-label">Draws</div><div class="rs-value">${w.draws}</div></div>` : ''}
          ${w.no_contests ? `<div class="record-stat"><div class="rs-label">NC</div><div class="rs-value">${w.no_contests}</div></div>` : ''}
        </div>
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Title History</div>
        ${titleHtml}
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Biggest Rivalries</div>
        ${rivalHtml}
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Top Tag Partners</div>
        ${partnerHtml}
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Signature Match</div>
        ${longestHtml}
      </div>

      <div class="profile-section">
        <div class="profile-section-title">Recent Events</div>
        ${recentHtml}
      </div>
    `;

    document.getElementById('profile-back-btn').addEventListener('click', () => {
      if (nav.backEvent) {
        navigateToEvent(nav.backEvent);
      } else {
        window.location.hash = '#roster';
      }
    });

    container.querySelectorAll('.crumb[data-bc]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.bc;
        if (type === 'calendar') {
          window.location.hash = '#calendar';
        } else if (type === 'month') {
          navigateToMonth(btn.dataset.y, parseInt(btn.dataset.m, 10));
        } else if (type === 'event') {
          navigateToEvent(btn.dataset.eventId);
        }
      });
    });

    container.querySelectorAll('button[data-event-id]:not(.crumb)').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = BUNDLE.events[String(btn.dataset.eventId)];
        if (ev) openModal([ev], ev.air_date, slug);
      });
    });

    window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------------
  // Hash routing
  // ------------------------------------------------------------------
  function route() {
    const hash = window.location.hash;
    document.querySelectorAll('section.view').forEach(v => { v.hidden = true; });
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const meterEl = document.getElementById('watch-progress');
    if (meterEl) meterEl.classList.remove('active');

    if (hash.startsWith('#wrestler/')) {
      const slug = hash.slice('#wrestler/'.length);
      const v = document.getElementById('view-wrestler');
      if (v) v.hidden = false;
      renderWrestler(slug);
    } else if (hash === '#roster') {
      const v = document.getElementById('view-roster');
      if (v) v.hidden = false;
      const tab = document.querySelector('.tab[data-view="roster"]');
      if (tab) tab.classList.add('active');
      renderRoster();
      // Browser scroll restoration may otherwise leave the user mid-roster
      // when arriving from a wrestler profile (different content height,
      // stale scroll offset). Always land at the top of the roster.
      window.scrollTo({ top: 0, behavior: 'auto' });
    } else if (hash === '#watched') {
      const v = document.getElementById('view-watched');
      if (v) v.hidden = false;
      const tab = document.querySelector('.tab[data-view="watched"]');
      if (tab) tab.classList.add('active');
      if (meterEl) meterEl.classList.add('active');
      renderWatched();
      window.scrollTo({ top: 0, behavior: 'auto' });
    } else if (hash === '#saved') {
      const v = document.getElementById('view-saved');
      if (v) v.hidden = false;
      const tab = document.querySelector('.tab[data-view="saved"]');
      if (tab) tab.classList.add('active');
      renderSaved();
      window.scrollTo({ top: 0, behavior: 'auto' });
    } else {
      const v = document.getElementById('view-calendar');
      if (v) v.hidden = false;
      const tab = document.querySelector('.tab[data-view="calendar"]');
      if (tab) tab.classList.add('active');
    }
  }

  document.querySelectorAll('.tab[data-view]').forEach(tab => {
    tab.addEventListener('click', () => {
      wrestlerSource = null;
      const view = tab.dataset.view;
      window.location.hash = view === 'calendar' ? '#calendar' : '#' + view;
    });
  });

  window.addEventListener('hashchange', route);

  // ------------------ Footer ----------------------------------------------
  function renderFooter() {
    const line = el('page-footer-line');
    if (!line) return;
    const meta = BUNDLE && BUNDLE.meta;
    if (!meta) return;
    const fmt = (n) => Number(n).toLocaleString('en-US');
    const yr = meta.year_range || [0, 0];
    const stats = `${fmt(meta.event_count)} events · ${fmt(meta.match_count)} matches · ${yr[0]}-${yr[1]}`;
    const attr = 'Data: Cagematch + Fandom';
    const repo = '<a class="page-footer__link" href="https://github.com/warner-wvez/wrestling-dashboard" target="_blank" rel="noopener">GitHub</a>';
    line.innerHTML = `${esc(stats)} · ${esc(attr)} · ${repo}`;
  }
  renderFooter();

  loadCalendar();
  route();
  refreshBookmarkUI();
  refreshWatchedUI();
  updateSavedTabCount();
  setupWatchedNav();
})();
</script>
</body>
</html>
