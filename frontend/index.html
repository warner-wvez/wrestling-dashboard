<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WVEZ Wrestling</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* WWE palette: black, white, red, blue */
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-soft: #F5F5F5;
    --surface-raised: #FAFAFA;
    --ink: #0A0A0A;
    --ink-soft: #2A2A2A;
    --ink-dim: #5F5F5F;
    --ink-faint: #9A9A9A;
    --border: #E5E5E5;
    --border-strong: #CCCCCC;

    --red: #C8102E;
    --red-dark: #8F0A1F;
    --red-soft: #FDE8EB;

    --blue: #003DA5;
    --blue-dark: #00205B;
    --blue-soft: #E0E8F5;

    --raw: var(--red);
    --raw-soft: var(--red-soft);
    --smackdown: var(--blue);
    --smackdown-soft: var(--blue-soft);
    --ppv: var(--red);
    --ppv-soft: var(--red-soft);

    --font-sans: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;

    --card-radius: 2px;

    --shadow-sm: 0 1px 2px rgba(10,10,10,0.04), 0 1px 3px rgba(10,10,10,0.06);
    --shadow-md: 0 4px 12px rgba(10,10,10,0.06), 0 2px 4px rgba(10,10,10,0.04);
    --shadow-lg: 0 12px 32px rgba(10,10,10,0.08), 0 4px 12px rgba(10,10,10,0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    font-weight: 500;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 32px 80px;
  }

  /* =============================================================
     HEADER
     ============================================================= */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    padding-bottom: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--ink);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: start;
  }
  .brand .logo {
    width: 34px;
    height: 34px;
    background: var(--ink);
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 0;
  }
  .brand .wordmark {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -0.005em;
  }
  .brand .wordmark .light {
    font-weight: 500;
    color: var(--ink-dim);
    margin-left: 6px;
  }

  .controls {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex-wrap: wrap;
    border: 1px solid var(--ink);
    justify-self: center;
  }
  .controls select {
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink);
    padding: 9px 44px 9px 28px;
    min-width: 180px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3L5 7L9 3' stroke='%230A0A0A' stroke-width='1.5' fill='none' stroke-linecap='square'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
  }
  .controls select:hover { background-color: var(--surface-soft); }
  .controls select:focus { outline: 2px solid var(--red); outline-offset: -2px; }

  .month-nav {
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink);
    padding: 9px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    line-height: 1;
    transition: background 140ms, opacity 140ms;
  }
  .month-nav:hover:not(:disabled) { background-color: var(--surface-soft); }
  .month-nav:focus { outline: 2px solid var(--red); outline-offset: -2px; }
  .month-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  .spoiler-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--ink);
    padding: 9px 24px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: background 140ms, color 140ms, box-shadow 140ms, border-color 140ms;
    justify-self: end;
  }
  .spoiler-btn:hover { background: var(--surface-soft); }
  .spoiler-btn .eye {
    width: 14px; height: 14px;
    background: var(--ink-dim);
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='square'><path d='M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24'/><line x1='1' y1='1' x2='23' y2='23'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='square'><path d='M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24'/><line x1='1' y1='1' x2='23' y2='23'/></svg>") no-repeat center / contain;
  }
  .spoiler-btn[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: #FFF;
    box-shadow: 0 0 0 3px var(--red-soft);
    animation: spoiler-live 2.4s ease-in-out infinite;
  }
  .spoiler-btn[aria-pressed="true"]:hover {
    background: var(--red-dark);
    border-color: var(--red-dark);
  }
  @keyframes spoiler-live {
    0%, 100% { box-shadow: 0 0 0 3px var(--red-soft); }
    50% { box-shadow: 0 0 0 6px rgba(200,16,46,0.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spoiler-btn[aria-pressed="true"] { animation: none; }
  }
  .spoiler-btn[aria-pressed="true"] .eye {
    background: #FFF;
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='square' stroke-linejoin='miter'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg>");
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='square' stroke-linejoin='miter'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/></svg>");
  }

  /* ---- Bookmark + Resume (persistent watch position) ----------------- */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-self: end;
  }
  .resume-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--ink);
    padding: 9px 18px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink);
    cursor: pointer;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .resume-btn:hover { background: var(--red); border-color: var(--red); color: #FFF; }
  .resume-btn[hidden] { display: none; }
  .resume-btn .rs-pin {
    width: 13px; height: 13px;
    background: var(--red);
    flex-shrink: 0;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 2h2v20H5z'/><path d='M7 3h12l-3 4 3 4H7z'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 2h2v20H5z'/><path d='M7 3h12l-3 4 3 4H7z'/></svg>") no-repeat center / contain;
  }
  .resume-btn:hover .rs-pin { background: #FFF; }
  .resume-btn .rs-date {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  .resume-btn:hover .rs-date { color: rgba(255,255,255,0.85); }

  /* Per-event bookmark toggle, sits beside the brand chip in the modal hero */
  .event-hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }
  .event-hero-top .brand-chip { margin-bottom: 0; }
  .bookmark-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--ink);
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .bookmark-btn:hover { background: var(--surface-soft); }
  .bookmark-btn.active { background: var(--red); border-color: var(--red); color: #FFF; }
  .bookmark-btn .bm-pin {
    width: 12px; height: 13px;
    background: currentColor;
    flex-shrink: 0;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 2h2v20H5z'/><path d='M7 3h12l-3 4 3 4H7z'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 2h2v20H5z'/><path d='M7 3h12l-3 4 3 4H7z'/></svg>") no-repeat center / contain;
  }

  /* Calendar day that holds the current bookmark */
  .day.has-bookmark { border-color: var(--red); }
  .day.has-bookmark::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--red);
  }

  /* ---- Watched toggle + progress meter ------------------------------- */
  .event-hero-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .watched-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--ink);
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .watched-btn:hover { background: var(--surface-soft); }
  .watched-btn.active { background: var(--ink); border-color: var(--ink); color: #FFF; }
  .watched-btn .wb-check {
    width: 13px; height: 13px;
    background: currentColor;
    flex-shrink: 0;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='square'><path d='M4 12.5l5 5L20 6.5'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='square'><path d='M4 12.5l5 5L20 6.5'/></svg>") no-repeat center / contain;
  }

  .watch-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
    align-self: center;
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 5px 8px;
    font-family: inherit;
    cursor: pointer;
    transition: background 140ms, border-color 140ms;
  }
  .watch-progress:hover { background: var(--surface-soft); border-color: var(--border-strong); }
  .watch-progress.active { background: var(--surface-soft); border-color: var(--ink); }
  .watch-progress::after { content: '\203A'; color: var(--ink-faint); font-weight: 700; font-size: 14px; line-height: 1; }
  .wp-bar {
    width: 120px;
    height: 6px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .wp-fill {
    height: 100%;
    width: 0;
    background: var(--red);
    transition: width 200ms ease;
  }
  .wp-text {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .wp-text strong { color: var(--ink); font-weight: 700; }

  /* Watched history view */
  .watched-progress-lg {
    height: 8px;
    max-width: 360px;
    margin-top: 12px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .watched-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .watched-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .wf-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .wf-chip:hover { border-color: var(--ink); color: var(--ink); }
  .wf-chip.active { background: var(--ink); border-color: var(--ink); color: #FFF; }
  .wf-chip .wf-n { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }
  #watched-view-content { display: flex; flex-direction: column; gap: 8px; }
  .watched-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 11px 14px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 140ms, box-shadow 140ms, transform 140ms;
  }
  .watched-row:hover { border-color: var(--ink); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .wr-check {
    width: 16px; height: 16px; flex-shrink: 0;
    background: var(--red);
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='square'><path d='M4 12.5l5 5L20 6.5'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='square'><path d='M4 12.5l5 5L20 6.5'/></svg>") no-repeat center / contain;
  }
  .wr-date { flex-shrink: 0; width: 96px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.02em; }
  .wr-show { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .wr-show .brand-chip { flex-shrink: 0; margin-bottom: 0; padding: 2px 7px; font-size: 9px; }
  .wr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-sans); font-size: 13px; font-weight: 700; color: var(--ink); }
  .wr-meta { flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
  .wr-go { flex-shrink: 0; font-family: var(--font-sans); font-size: 11px; font-weight: 700; color: var(--red); white-space: nowrap; }
  .wr-remove {
    flex-shrink: 0;
    font-family: var(--font-sans); font-size: 11px; font-weight: 700;
    color: var(--ink-faint); padding: 4px 8px; border: 1px solid transparent;
    white-space: nowrap;
  }
  .wr-remove:hover { color: var(--red); border-color: var(--red); }
  @media (max-width: 700px) {
    .wr-meta, .wr-go { display: none; }
    .wr-date { width: auto; }
  }
  .mini-chip.watched { opacity: 0.4; }
  @media (max-width: 600px) {
    .wp-bar { display: none; }
  }

  /* ---- Save match + Saved view --------------------------------------- */
  .save-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 4px 9px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .save-btn:hover { border-color: var(--ink); color: var(--ink); }
  .save-btn.active { background: var(--red); border-color: var(--red); color: #FFF; }
  .save-btn .sv-ribbon {
    width: 11px; height: 11px;
    background: currentColor;
    flex-shrink: 0;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2h12a1 1 0 011 1v19l-7-4.2L5 22V3a1 1 0 011-1z'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2h12a1 1 0 011 1v19l-7-4.2L5 22V3a1 1 0 011-1z'/></svg>") no-repeat center / contain;
  }
  .match-card.flash { animation: match-flash 1.6s ease; }
  @keyframes match-flash {
    0%, 100% { background: var(--surface); }
    15% { background: var(--red-soft); border-color: var(--red); }
  }

  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    margin-left: 6px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--red);
    color: #FFF;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    vertical-align: middle;
  }
  .tab-count[hidden] { display: none; }

  .saved-view-header { margin-bottom: 20px; }
  .saved-view-header h2 {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .saved-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .saved-empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-dim);
    border: 1px dashed var(--border-strong);
    background: var(--surface-soft);
  }
  #saved-view-content { display: flex; flex-direction: column; gap: 8px; }
  .saved-row {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    grid-template-areas:
      "date show remove"
      "date match remove"
      "date people remove";
    align-items: center;
    gap: 2px 14px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 12px 14px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 140ms, box-shadow 140ms, transform 140ms;
  }
  .saved-row:hover { border-color: var(--ink); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .sr-date {
    grid-area: date;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  .sr-show {
    grid-area: show;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .sr-show .brand-chip { margin-bottom: 0; padding: 2px 7px; font-size: 9px; }
  .sr-match { grid-area: match; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sr-type { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .sr-people { grid-area: people; font-family: var(--font-sans); font-size: 12px; color: var(--ink-dim); }
  .sr-remove {
    grid-area: remove;
    align-self: center;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-faint);
    padding: 4px 8px;
    border: 1px solid transparent;
  }
  .sr-remove:hover { color: var(--red); border-color: var(--red); }
  @media (max-width: 600px) {
    .saved-row {
      grid-template-columns: 1fr auto;
      grid-template-areas: "date remove" "show show" "match match" "people people";
    }
  }

  /* Strip the trailing internal divider from whichever button is last in
     .controls; otherwise it doubles up against the .controls outer border. */
  .controls > *:last-child { border-right: none; }

  .modal-spoiler-btn {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--ink);
    background: var(--surface);
    font-size: 12px;
    gap: 6px;
    flex: 0 0 auto;
  }
  .modal-spoiler-btn .eye { width: 14px; height: 14px; }
  .modal-spoiler-btn:hover { background: var(--ink); color: #FFF; }
  .modal-spoiler-btn:hover .eye { background: #FFF; }

  /* =============================================================
     MAIN GRID: content + sidebar
     ============================================================= */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 32px;
  }

  .content { min-width: 0; }
  .sidebar { min-width: 0; }

  /* =============================================================
     HERO
     ============================================================= */
  .hero {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--ink);
    border-radius: var(--card-radius);
    padding: 28px 32px;
    margin-bottom: 32px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 28px;
    align-items: end;
    cursor: pointer;
    transition: transform 180ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 180ms;
  }
  .hero:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .hero.ppv {
    background:
      linear-gradient(135deg, rgba(200,16,46,0.06) 0%, transparent 40%),
      var(--surface);
  }
  .hero.ppv::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--red);
  }
  .hero.smackdown {
    background:
      linear-gradient(135deg, rgba(0,61,165,0.06) 0%, transparent 40%),
      var(--surface);
  }
  .hero.smackdown::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--blue);
  }

  .hero-info { min-width: 0; }
  .hero-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 12px;
  }
  .hero-kicker .pulse {
    width: 7px; height: 7px;
    background: var(--blue);
    position: relative;
    box-shadow: 0 0 0 0 rgba(0,61,165,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,61,165,0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(0,61,165,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,61,165,0); }
  }
  .hero.ppv .hero-kicker { color: var(--red); }
  .hero.ppv .hero-kicker .pulse {
    background: var(--red);
    animation-name: pulse-red;
  }
  @keyframes pulse-red {
    0%   { box-shadow: 0 0 0 0 rgba(200,16,46,0.5); }
    70%  { box-shadow: 0 0 0 6px rgba(200,16,46,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,16,46,0); }
  }

  .hero-title {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 40px;
    letter-spacing: -0.025em;
    line-height: 1.02;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-dim);
  }
  .hero-meta .chip {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    text-transform: uppercase;
  }
  .chip.raw { background: var(--red-soft); color: var(--red); }
  .chip.smackdown { background: var(--blue-soft); color: var(--blue); }
  .chip.ppv { background: var(--ink); color: #FFF; }
  .hero-meta .dot {
    width: 3px; height: 3px; background: var(--ink-faint); display: inline-block;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink);
    color: #FFF;
    padding: 14px 24px;
    border: none;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0;
    cursor: pointer;
    transition: background 140ms, transform 140ms;
    white-space: nowrap;
  }
  .hero-cta:hover {
    background: var(--red);
    transform: translateY(-1px);
  }
  .hero.ppv .hero-cta { background: var(--red); }
  .hero.ppv .hero-cta:hover { background: var(--ink); }
  .hero-cta .arrow { transition: transform 140ms; }
  .hero:hover .hero-cta .arrow { transform: translateX(3px); }

  .hero-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px 0;
  }
  .hero-empty .hero-title { font-size: 24px; color: var(--ink-dim); }
  .hero-empty .hero-cta { display: none; }

  /* =============================================================
     MONTH SECTION
     ============================================================= */
  .month-section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .month-section-head h2 {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.025em;
  }
  .month-section-head h2 .year {
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 10px;
  }
  .month-section-head .count {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .month-section-head .count strong { color: var(--ink); font-weight: 700; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 0 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .weekdays > div {
    padding: 2px 6px;
    text-align: left;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding-top: 8px;
  }
  .day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    min-height: 96px;
    position: relative;
    padding: 10px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 140ms, box-shadow 140ms, border-color 140ms;
    opacity: 0;
    animation: card-in 220ms cubic-bezier(0.2,0.8,0.2,1) forwards;
    animation-delay: calc(var(--i, 0) * 4ms);
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .day.other-month {
    background: transparent;
    border-color: transparent;
  }
  .day.other-month .date { color: var(--ink-faint); opacity: 0.5; }
  .day.empty {
    background: transparent;
    border: 1px dashed var(--border);
  }
  .day.has-events { cursor: pointer; }
  .day.has-events:hover {
    transform: translateY(-2px);
    border-color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .day.has-ppv {
    background: linear-gradient(160deg, #FFF 0%, #FFF5F6 100%);
    border-color: var(--red);
  }
  .day.has-ppv:hover {
    box-shadow: 0 8px 20px rgba(200,16,46,0.10);
  }

  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .day .date {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .day .weekday-tiny {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .day-markers {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: auto;
  }
  .mini-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 3px 7px;
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .mini-chip .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mini-chip .ct {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    opacity: 0.75;
    flex-shrink: 0;
  }
  .mini-chip.raw { background: var(--red-soft); color: var(--red); }
  .mini-chip.smackdown { background: var(--blue-soft); color: var(--blue); }
  .mini-chip.ppv { background: var(--red); color: #FFF; }
  .mini-chip.ppv .ct { opacity: 0.9; }

  .status {
    grid-column: 1 / -1;
    padding: 40px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
  }

  /* =============================================================
     SIDEBAR
     ============================================================= */
  .side-panel {
    background: var(--surface);
    border: 1px solid var(--ink);
    padding: 20px;
    margin-bottom: 20px;
    position: sticky;
    top: 20px;
  }
  .side-panel-title {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .side-panel-title::before {
    content: '';
    width: 10px; height: 10px;
    background: var(--red);
    flex-shrink: 0;
  }
  .side-panel-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .side-panel-sub strong { color: var(--ink); font-weight: 700; }

  .roster {
    display: flex;
    flex-direction: column;
  }
  .roster-row {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    align-items: baseline;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .roster-row:last-child { border-bottom: none; }
  .roster-row .rank {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }
  .roster-row.top .rank {
    color: var(--red);
    font-weight: 900;
  }
  .roster-row .name {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roster-row.top .name { font-weight: 900; }
  .roster-row .count {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-dim);
    text-align: right;
  }
  .roster-row .count strong {
    color: var(--ink);
    font-weight: 700;
  }
  .roster-row.top .count strong { color: var(--red); }
  .roster-row .name button.wrestler-link {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }

  .roster-empty {
    padding: 20px 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .roster-note {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  /* =============================================================
     MODAL
     ============================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 100;
    padding: 40px 16px;
    overflow: hidden;
  }
  .modal-backdrop.open {
    display: flex;
    animation: fade-in 160ms ease-out;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  /* The scroll lives on .modal (not .modal-backdrop) so the sticky toolbar
     inside has a scrolling ancestor whose viewport is shorter than the
     content. With scroll on the backdrop and .modal sized to content, the
     whole .modal would translate upward as one block and sticky would
     never detach. */
  .modal {
    background: var(--bg);
    border: 1px solid var(--ink);
    width: min(96vw, 820px);
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    animation: sheet-in 220ms cubic-bezier(0.2,0.8,0.2,1);
    box-shadow: 0 24px 60px rgba(10,10,10,0.25);
  }
  @keyframes sheet-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border: 1px solid var(--ink);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    transition: background 140ms, color 140ms;
    flex: 0 0 auto;
  }
  .modal-close:hover { background: var(--ink); color: #FFF; }
  .modal-close svg { width: 14px; height: 14px; }

  .event-block + .event-block { border-top: 1px solid var(--ink); }

  .event-hero {
    padding: 32px 32px 24px;
    position: relative;
  }
  .event-hero.ppv {
    background: linear-gradient(135deg, rgba(200,16,46,0.08) 0%, transparent 45%);
  }
  .event-hero.ppv::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--red);
  }
  .event-hero .brand-chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .brand-chip.raw { background: var(--red-soft); color: var(--red); }
  .brand-chip.smackdown { background: var(--blue-soft); color: var(--blue); }
  .brand-chip.ppv { background: var(--ink); color: #FFF; }

  .event-title-modal {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.022em;
    line-height: 1.08;
    margin-bottom: 12px;
  }
  .event-meta-modal {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .event-meta-modal .piece { display: inline-flex; align-items: center; gap: 6px; }
  .event-meta-modal .piece::before {
    content: '';
    width: 3px; height: 3px; background: var(--ink-faint);
  }
  .event-meta-modal .piece:first-child::before { display: none; }

  .matches-list {
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
    transition: border-color 140ms;
  }
  .match-card:hover { border-color: var(--border-strong); }

  .match-header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .m-number {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    padding: 2px 6px;
    background: var(--surface-soft);
  }
  .m-type {
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .m-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .m-tag.title { background: var(--red-soft); color: var(--red-dark); }
  .m-tag.stip { background: var(--blue-soft); color: var(--blue-dark); }

  /* Match Guide rating badge: visible in both spoiler modes (rating is not a spoiler). */
  .m-rating {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    border: 1px solid var(--border);
  }
  .m-rating .star {
    color: var(--red);
    font-size: 11px;
    line-height: 1;
  }
  .m-rating .num {
    color: var(--ink);
    font-weight: 700;
  }

  /* Tale of the tape */
  .match-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
  }
  .team {
    min-width: 0;
    position: relative;
    padding: 10px 12px;
    transition: background 220ms;
  }
  .team.left { text-align: right; }
  .team.right { text-align: left; }
  .team .team-names {
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.01em;
    transition: color 220ms;
  }
  .team .team-meta {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 3px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .champ-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--red);
    color: #FFF;
    font-family: var(--font-sans);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.1em;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .champ-badge::before {
    content: '';
    width: 8px; height: 8px;
    background: #FFF;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>") no-repeat center / contain;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>") no-repeat center / contain;
  }

  .vs-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    height: 32px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    transition: all 220ms;
    padding: 0 10px;
  }
  .vs-cell .vs-text { display: inline; }
  .vs-cell .def-text { display: none; }
  .vs-cell .def-arrow { color: var(--red); font-weight: 900; }

  .match-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    min-height: 22px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 260ms, max-height 260ms, margin-top 260ms, padding-top 260ms;
  }
  .match-footer .duration {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }
  .match-footer .duration::before {
    content: '◷';
    margin-right: 6px;
    color: var(--ink-faint);
  }
  .match-footer .outcome-flag {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
  }
  .outcome-flag.nc { background: var(--red-soft); color: var(--red); }
  .outcome-flag.dq { background: var(--red-soft); color: var(--red-dark); }
  .outcome-flag.co { background: var(--red-soft); color: var(--red-dark); }
  .outcome-flag.draw { background: var(--surface-soft); color: var(--ink-dim); }

  /* Match details dropdown */
  .details-toggle {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    padding: 3px 9px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 140ms;
  }
  .details-toggle:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .details-toggle .chev {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-1px) rotate(45deg);
    transition: transform 180ms cubic-bezier(0.2,0.8,0.2,1);
  }
  .match-card.open .details-toggle {
    border-color: var(--ink);
    color: var(--ink);
    background: var(--ink);
    color: #FFF;
  }
  .match-card.open .details-toggle .chev {
    transform: translateY(2px) rotate(-135deg);
  }

  .details-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 240ms cubic-bezier(0.2,0.8,0.2,1);
  }
  .match-card.open .details-panel {
    grid-template-rows: 1fr;
  }
  .details-panel > .details-inner {
    overflow: hidden;
    min-height: 0;
  }
  .match-card.open .details-panel > .details-inner {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  .details-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 12px;
    padding: 8px 0;
    align-items: start;
  }
  .details-row + .details-row { border-top: 1px solid var(--border); }
  .details-row .label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-top: 2px;
  }
  .details-row .value {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    line-height: 1.55;
  }
  .details-row .value.mono {
    font-family: var(--font-mono);
  }
  .details-row .value.hidden-note {
    color: var(--ink-faint);
    font-style: italic;
  }

  /* Star rating */
  .rating {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .rating .stars {
    position: relative;
    display: inline-block;
    font-size: 14px;
    line-height: 1;
    letter-spacing: 2px;
    color: var(--border-strong);
  }
  .rating .stars::before {
    content: '★★★★★';
  }
  .rating .stars-fill {
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
    color: var(--red);
    white-space: nowrap;
  }
  .rating .stars-fill::before {
    content: '★★★★★';
  }
  .rating .rating-num {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.02em;
  }
  .rating .rating-scale {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  /* Spoilers off: mask the spoilery fields inside details */
  body:not(.spoilers-on) .details-panel .spoilery {
    filter: blur(5px);
    user-select: none;
    pointer-events: none;
    transition: filter 180ms;
  }
  body:not(.spoilers-on) .details-panel .spoilery:hover {
    filter: blur(5px);
  }

  /* Spoilers off: baseline */
  body:not(.spoilers-on) .team.winner .team-names,
  body:not(.spoilers-on) .team.loser .team-names {
    color: var(--ink);
    font-weight: 700;
  }

  /* Spoilers on: the reveal */
  body.spoilers-on .team.winner {
    background: linear-gradient(90deg, rgba(200,16,46,0.08) 0%, rgba(200,16,46,0) 100%);
  }
  body.spoilers-on .team.right.winner {
    background: linear-gradient(270deg, rgba(200,16,46,0.08) 0%, rgba(200,16,46,0) 100%);
  }
  body.spoilers-on .team.winner::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--red);
    animation: sweep-in 340ms cubic-bezier(0.2,0.8,0.2,1) both;
    animation-delay: calc(var(--match-index, 0) * 30ms);
  }
  body.spoilers-on .team.right.winner::before {
    left: auto; right: 0;
    animation-name: sweep-in-right;
  }
  @keyframes sweep-in {
    from { transform: scaleY(0); transform-origin: top; opacity: 0; }
    to   { transform: scaleY(1); transform-origin: top; opacity: 1; }
  }
  @keyframes sweep-in-right {
    from { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
    to   { transform: scaleY(1); transform-origin: bottom; opacity: 1; }
  }
  body.spoilers-on .team.winner .team-names {
    color: var(--red);
    font-weight: 900;
  }
  body.spoilers-on .team.loser .team-names {
    color: var(--ink-faint);
    font-weight: 500;
  }
  body.spoilers-on .vs-cell .vs-text { display: none; }
  body.spoilers-on .vs-cell .def-text { display: inline; }
  body.spoilers-on .vs-cell {
    background: var(--ink);
    color: #FFF;
    border-color: var(--ink);
  }
  body.spoilers-on .vs-cell .def-arrow { color: var(--red); }

  body.spoilers-on .match-footer {
    opacity: 1;
    max-height: 60px;
    transition: opacity 280ms ease-out calc(130ms + var(--match-index, 0) * 30ms),
                max-height 280ms ease-out calc(130ms + var(--match-index, 0) * 30ms);
  }

  /* Multi-team */
  /* =============================================================
     STACKED BODY (battle royals + large-team matches)
     ============================================================= */
  .match-body.stacked {
    display: block;
    text-align: left;
  }
  .team-block {
    padding: 14px 6px;
  }
  .team-block.winner {
    text-align: center;
    padding-top: 18px;
    padding-bottom: 18px;
  }
  .team-block-header {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .team-block.winner .team-block-header {
    color: var(--red);
  }
  .team-block-banner {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .team-block-banner .wrestler-link {
    font-size: inherit;
    font-weight: inherit;
  }
  .team-block-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px 16px;
  }
  .team-block-grid .wrestler-link {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .team-block-badges {
    margin-top: 10px;
  }
  .team-block-meta {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .team-block.winner .team-block-meta {
    text-align: center;
  }
  .stacked-divider {
    border-top: 1px solid var(--border);
    margin: 0 12px;
  }

  /* Battle royal / Royal Rumble winner reveal: hide WINNER label and name
     when spoilers are off so the stacked layout doesn't leak the result. */
  .team-block-mask {
    display: none;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-faint);
    letter-spacing: 0.4em;
    padding: 6px 0;
  }
  body:not(.spoilers-on) .team-block.winner > .team-block-header,
  body:not(.spoilers-on) .team-block.winner > .team-block-banner,
  body:not(.spoilers-on) .team-block.winner > .team-block-grid,
  body:not(.spoilers-on) .team-block.winner > .team-block-badges,
  body:not(.spoilers-on) .team-block.winner > .team-block-meta {
    display: none;
  }
  body:not(.spoilers-on) .team-block.winner > .team-block-mask {
    display: block;
  }

  .match-body.multi {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .match-body.multi .team {
    text-align: left;
    padding: 10px 12px;
  }
  .match-body.multi .team.winner::before {
    left: 0; right: auto;
  }
  .match-body.multi .vs-cell { display: none; }
  .match-body.multi .multi-divider {
    padding: 4px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* =============================================================
     RESPONSIVE
     ============================================================= */
  @media (max-width: 1040px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { order: -1; }
    .side-panel { position: static; }
  }

  @media (max-width: 720px) {
    body { padding: 16px 14px 60px; }
    header { flex-direction: column; align-items: stretch; gap: 14px; }
    .hero { grid-template-columns: 1fr; padding: 22px; gap: 18px; }
    .hero-title { font-size: 26px; }
    .hero-cta { justify-self: start; }
    .calendar { gap: 4px; }
    .weekdays { font-size: 9px; }
    .day { min-height: 66px; padding: 8px; }
    .day .date { font-size: 13px; }
    .weekday-tiny { display: none; }
    .mini-chip { font-size: 9px; padding: 2px 5px; }
    .mini-chip .ct { display: none; }
    .event-hero { padding: 22px 18px 18px; }
    .event-title-modal { font-size: 22px; }
    .matches-list { padding: 12px 14px 20px; }
    .match-card { padding: 12px; }
    .match-body { grid-template-columns: 1fr; gap: 6px; }
    .team.left, .team.right { text-align: left; }
    .vs-cell { margin: 0 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ===========================================================
     TABS
     =========================================================== */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--border);
    margin-bottom: 28px;
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    padding: 10px 22px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 140ms, border-color 140ms;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--red); }
  .tab:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }

  /* ===========================================================
     VIEWS
     =========================================================== */
  section.view[hidden] { display: none !important; }

  /* ===========================================================
     WRESTLER LINK
     =========================================================== */
  button.wrestler-link {
    border: 0; background: 0; padding: 0;
    font: inherit; font-weight: inherit;
    color: inherit; cursor: pointer;
    text-align: left;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-underline-offset: 2px;
    transition: text-decoration-color 120ms, color 120ms;
  }
  button.wrestler-link:hover,
  button.wrestler-link:focus-visible {
    text-decoration-color: var(--red);
    color: var(--red);
    outline: none;
  }
  button.wrestler-link.source {
    color: var(--red);
    text-decoration-color: var(--red);
    font-weight: 900;
  }

  /* ===========================================================
     HOVER TOOLTIP
     =========================================================== */
  #wrestler-tooltip {
    position: fixed;
    z-index: 200;
    background: var(--bg);
    border: 1px solid var(--ink);
    box-shadow: var(--shadow-lg);
    padding: 14px 16px;
    max-width: 240px;
    pointer-events: none;
    display: none;
  }
  #wrestler-tooltip.visible { display: block; }
  .tt-name {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .tt-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  .tt-val { font-weight: 700; color: var(--ink); text-align: right; }

  /* ===========================================================
     ROSTER VIEW
     =========================================================== */
  .roster-view-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .roster-view-header h2 {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.025em;
    flex: 1;
    min-width: 120px;
  }
  .roster-controls {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--ink);
    flex-wrap: wrap;
  }
  .roster-search {
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink);
    padding: 9px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    min-width: 180px;
  }
  .roster-search:focus { outline: 2px solid var(--red); outline-offset: -2px; }
  .roster-search::placeholder { color: var(--ink-faint); font-weight: 500; }
  .roster-sort {
    background: transparent;
    border: none;
    padding: 9px 32px 9px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3L5 7L9 3' stroke='%230A0A0A' stroke-width='1.5' fill='none' stroke-linecap='square'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  .roster-sort:hover { background-color: var(--surface-soft); }
  .roster-sort:focus { outline: 2px solid var(--red); outline-offset: -2px; }
  .roster-table { width: 100%; border-collapse: collapse; }
  .roster-table th {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: left;
    padding: 8px 12px;
    border-bottom: 2px solid var(--ink);
    white-space: nowrap;
  }
  .roster-table th:not(:first-child) { text-align: right; }
  .roster-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-size: 13px;
  }
  .roster-table td:not(:first-child) { text-align: right; }
  .roster-table tr:hover td { background: var(--surface-soft); }
  .roster-table .rt-rank { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); width: 48px; }
  .roster-table .rt-name button {
    border: 0; background: 0; padding: 0;
    font-family: var(--font-sans); font-size: 14px; font-weight: 700;
    color: var(--ink); cursor: pointer; letter-spacing: -0.01em; text-align: left;
    text-decoration: underline; text-decoration-color: transparent;
    text-underline-offset: 2px; transition: text-decoration-color 120ms, color 120ms;
  }
  .roster-table .rt-name button:hover { text-decoration-color: var(--red); color: var(--red); }
  .roster-table .rt-name button:focus-visible { outline: 2px solid var(--red); }
  .roster-table .rt-num { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .roster-table .rt-years { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
  .roster-no-results {
    padding: 40px; text-align: center; color: var(--ink-faint);
    font-family: var(--font-mono); font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ===========================================================
     WRESTLER PROFILE VIEW
     =========================================================== */
  .profile-back {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; background: transparent; padding: 0;
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    color: var(--ink-dim); cursor: pointer; letter-spacing: 0.02em;
    margin-bottom: 24px; transition: color 120ms;
  }
  .profile-back:hover { color: var(--red); }
  .profile-back:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .profile-back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--ink); background: var(--surface);
    padding: 9px 16px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    color: var(--ink); cursor: pointer; letter-spacing: 0.04em;
    margin-bottom: 24px;
    transition: background 140ms, color 140ms;
    max-width: 100%;
  }
  .profile-back-btn:hover { background: var(--ink); color: #FFF; }
  .profile-back-btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .profile-back-btn .pb-arrow { color: var(--red); font-weight: 900; }
  .profile-back-btn:hover .pb-arrow { color: #FFF; }
  .profile-back-btn .pb-label {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 360px;
  }

  .breadcrumbs {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px 8px;
    margin-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .breadcrumbs .crumb {
    background: transparent; border: none; padding: 0;
    font: inherit; color: var(--ink-faint);
    cursor: pointer; letter-spacing: inherit; text-transform: inherit;
    transition: color 120ms;
    max-width: 320px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .breadcrumbs .crumb:hover,
  .breadcrumbs .crumb:focus-visible {
    color: var(--red); outline: none;
  }
  .breadcrumbs .crumb.current {
    color: var(--ink); font-weight: 700; cursor: default;
  }
  .breadcrumbs .crumb-sep {
    color: var(--border-strong); font-weight: 700;
  }
  .profile-header { margin-bottom: 32px; padding-bottom: 28px; border-bottom: 2px solid var(--ink); }
  .profile-name {
    font-family: var(--font-sans); font-weight: 900; font-size: 42px;
    letter-spacing: -0.025em; line-height: 1.02; margin-bottom: 8px;
  }
  .profile-years {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .profile-section { margin-bottom: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
  .profile-section:last-child { border-bottom: none; margin-bottom: 0; }
  .profile-section-title {
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 16px;
  }
  .record-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .record-stat { background: var(--surface-soft); border: 1px solid var(--border); padding: 14px 16px; }
  .record-stat .rs-label {
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px;
  }
  .record-stat .rs-value { font-family: var(--font-sans); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; }
  .record-stat.wins .rs-value { color: var(--red); }
  .title-list, .rivalry-list, .partner-list, .recent-events-list { display: flex; flex-direction: column; }
  .title-row, .rivalry-row, .partner-row, .recent-event-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .title-row:last-child, .rivalry-row:last-child, .partner-row:last-child, .recent-event-row:last-child { border-bottom: none; }
  .title-row .title-name { font-family: var(--font-sans); font-weight: 700; font-size: 13px; }
  .title-row.sig .title-name { color: var(--red); font-weight: 900; }
  .title-row .title-count, .rivalry-row .rv-count, .partner-row .pn-count {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0;
  }
  .recent-event-row .re-date {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0;
  }
  .signature-match { background: var(--surface-soft); border: 1px solid var(--border); padding: 18px 20px; }
  .signature-match .sm-duration { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-bottom: 10px; }
  .sm-event-link {
    border: none; background: transparent; padding: 0;
    font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--ink);
    cursor: pointer; text-decoration: underline; text-decoration-color: transparent;
    text-underline-offset: 2px; transition: color 120ms, text-decoration-color 120ms;
  }
  .sm-event-link:hover { color: var(--red); text-decoration-color: var(--red); }
  .sm-event-link:focus-visible { outline: 2px solid var(--red); }
  .signature-match .sm-desc {
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); margin-top: 10px; line-height: 1.65;
  }
  button.recent-event-link {
    border: 0; background: 0; padding: 0;
    font-family: var(--font-sans); font-size: 13px; font-weight: 700;
    color: var(--ink); cursor: pointer; text-align: left;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-underline-offset: 2px;
    transition: text-decoration-color 120ms, color 120ms;
  }
  button.recent-event-link:hover,
  button.recent-event-link:focus-visible {
    text-decoration-color: var(--red);
    color: var(--red);
    outline: none;
  }

  @media (max-width: 760px) {
    header {
      grid-template-columns: 1fr;
      justify-items: center;
      row-gap: 16px;
    }
    .brand { justify-self: center; }
    .controls { justify-self: center; }
    .controls select { padding: 10px 32px 10px 16px; font-size: 13px; min-width: 0; }
    .month-nav { padding: 10px 16px; font-size: 14px; }
    .spoiler-btn { padding: 10px 16px; font-size: 13px; gap: 7px; justify-self: center; }
    .spoiler-btn .eye { width: 14px; height: 14px; }
  }
  @media (max-width: 720px) {
    .profile-name { font-size: 28px; }
    .record-grid { grid-template-columns: repeat(2, 1fr); }
    .tabs .tab { padding: 8px 14px; font-size: 12px; }
    #wrestler-tooltip { display: none !important; }
    .roster-controls { width: 100%; }
    .roster-search { flex: 1; min-width: 0; }
  }

  /* =============================================================
     PAGE FOOTER
     ============================================================= */
  .page-footer {
    margin-top: 60px;
    padding: 18px 0 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  .page-footer__link {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 140ms, border-color 140ms;
  }
  .page-footer__link:hover,
  .page-footer__link:focus-visible {
    color: var(--ink);
    border-bottom-color: var(--ink);
    outline: none;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="logo">W</div>
    <div class="wordmark">WVEZ<span class="light">Wrestling</span></div>
  </div>
  <div class="controls">
    <button class="month-nav" id="month-prev" aria-label="Previous month" type="button">◀</button>
    <select id="month" aria-label="Month"></select>
    <select id="year" aria-label="Year"></select>
    <button class="month-nav" id="month-next" aria-label="Next month" type="button">▶</button>
  </div>
  <div class="header-actions">
    <button class="resume-btn" id="resume-btn" type="button" hidden aria-label="Resume where you left off">
      <span class="rs-pin" aria-hidden="true"></span>
      <span class="rs-label">Resume</span>
      <span class="rs-date"></span>
    </button>
    <button class="spoiler-btn" id="spoiler-btn" aria-pressed="false" type="button">
      <span class="eye"></span>
      <span class="sp-label">Spoilers Off</span>
    </button>
  </div>
</header>

<nav class="tabs" id="main-tabs">
  <button class="tab active" data-view="calendar" type="button">Calendar</button>
  <button class="tab" data-view="roster" type="button">Roster</button>
  <button class="tab" data-view="saved" type="button">Saved<span class="tab-count" id="saved-tab-count" hidden></span></button>
  <button class="tab" data-view="watched" type="button">Watched</button>
  <button class="watch-progress" id="watch-progress" type="button" title="See everything you have watched">
    <div class="wp-bar"><div class="wp-fill" id="wp-fill"></div></div>
    <span class="wp-text"><strong id="watched-count">0</strong> / <span id="watched-total">0</span> watched</span>
  </button>
</nav>

<section id="view-calendar" class="view">

<!-- HERO -->
<div class="hero" id="hero" role="button" tabindex="0"></div>

<!-- LAYOUT -->
<div class="layout">
  <section class="content">
    <div class="month-section-head">
      <h2><span id="month-name">January</span><span class="year" id="month-year">2001</span></h2>
      <div class="count"><strong id="month-count">0</strong> events this month</div>
    </div>
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </section>

  <aside class="sidebar">
    <div class="side-panel">
      <div class="side-panel-title">Most Featured</div>
      <div class="side-panel-sub">By matches worked in <strong id="roster-month">March 2004</strong></div>
      <div class="roster" id="roster"></div>
      <div class="roster-note" id="roster-note">Ranked by number of matches on televised cards this month.</div>
    </div>
  </aside>
</div>

</section><!-- end view-calendar -->

<section id="view-roster" class="view" hidden>
  <div class="roster-view-header">
    <h2>Roster</h2>
    <div class="roster-controls">
      <input class="roster-search" id="roster-search" type="search" placeholder="Filter by name..." autocomplete="off">
      <select class="roster-sort" id="roster-sort" aria-label="Sort by">
        <option value="name">Name</option>
        <option value="matches">Total Matches</option>
        <option value="ppv">PPV Appearances</option>
        <option value="shows">Shows Worked</option>
      </select>
    </div>
  </div>
  <div id="roster-view-content"></div>
</section>

<section id="view-saved" class="view" hidden>
  <div class="saved-view-header">
    <h2>Saved matches</h2>
    <div class="saved-sub" id="saved-sub"></div>
  </div>
  <div id="saved-view-content"></div>
</section>

<section id="view-watched" class="view" hidden>
  <div class="saved-view-header">
    <h2>Watched</h2>
    <div class="saved-sub" id="watched-sub"></div>
    <div class="watched-progress-lg"><div class="wp-fill" id="watched-view-fill"></div></div>
  </div>
  <div class="watched-controls">
    <div class="watched-filters" id="watched-filters">
      <button class="wf-chip active" type="button" data-wfilter="all">All <span class="wf-n" data-wcount="all">0</span></button>
      <button class="wf-chip" type="button" data-wfilter="Raw">Raw <span class="wf-n" data-wcount="Raw">0</span></button>
      <button class="wf-chip" type="button" data-wfilter="SmackDown">SmackDown <span class="wf-n" data-wcount="SmackDown">0</span></button>
      <button class="wf-chip" type="button" data-wfilter="PPV">PPV <span class="wf-n" data-wcount="PPV">0</span></button>
    </div>
    <select class="roster-sort" id="watched-sort" aria-label="Sort watched shows">
      <option value="recent">Recently watched</option>
      <option value="airdate">Air date</option>
    </select>
  </div>
  <div id="watched-view-content"></div>
</section>

<section id="view-wrestler" class="view" hidden>
  <div id="wrestler-profile-content"></div>
</section>

<!-- MODAL (sibling of all .view sections so it can render over any active view) -->
<div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-toolbar">
      <button class="spoiler-btn modal-spoiler-btn" id="modal-spoiler-btn" aria-pressed="false" type="button">
        <span class="eye"></span>
        <span class="sp-label">Spoilers Off</span>
      </button>
      <button class="modal-close" id="modal-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
          <line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<div id="wrestler-tooltip" aria-hidden="true"></div>

<footer class="page-footer">
  <span id="page-footer-line"></span>
</footer>

<script>
(() => {
  const API = 'http://127.0.0.1:8000';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const SHOW_CLASS = { Raw: 'raw', SmackDown: 'smackdown', PPV: 'ppv' };
  const SPOILER_KEY = 'wvez_wrestling_spoilers';

  const el = (id) => document.getElementById(id);
  const yearSel = el('year'), monthSel = el('month'), calEl = el('calendar');
  const mBackdrop = el('modal-backdrop'), mContent = el('modal-content');
  // .modal is the scroll container (see CSS comment on .modal). The backdrop
  // is just the dimmed overlay; it does not scroll.
  const mEl = mBackdrop.querySelector('.modal');
  const spoilerButtons = [el('spoiler-btn'), el('modal-spoiler-btn')].filter(Boolean);
  const monthNameEl = el('month-name'), monthYearEl = el('month-year'), monthCountEl = el('month-count');
  const heroEl = el('hero');
  const rosterEl = el('roster'), rosterMonthEl = el('roster-month');

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDuration = (sec) => {
    if (sec == null) return '';
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  };

  // Cagematch records team_name in mixed forms ("Raven and The Big Show",
  // "Raven & The Big Show"); we always join participants with ' & '. Compare
  // both sides on a normalized form so trivial separator differences don't
  // produce a redundant "as X & Y" meta line under the participant list.
  const canonTeamLabel = (s) => String(s ?? '')
    .toLowerCase()
    .replace(/\s*&\s*/g, ' and ')
    .replace(/\s+/g, ' ')
    .trim();

  const dataEl = document.getElementById('wrestling-data');
  const BUNDLE = dataEl ? JSON.parse(dataEl.textContent) : null;
  const SUMMARY_KEYS = ['id','air_date','show_type','title','venue','city','episode_number','ppv_name','match_count'];

  // In-memory cache of event details to make reopening modals instant.
  const detailCache = new Map();

  async function getMonthEvents(year, month) {
    if (BUNDLE) {
      const prefix = `${year}-${String(month).padStart(2,'0')}-`;
      const out = [];
      for (const [iso, ids] of Object.entries(BUNDLE.events_by_date)) {
        if (!iso.startsWith(prefix)) continue;
        for (const id of ids) {
          const full = BUNDLE.events[String(id)];
          if (!full) continue;
          const row = {};
          for (const k of SUMMARY_KEYS) row[k] = full[k] ?? null;
          out.push(row);
        }
      }
      out.sort((a, b) => a.air_date.localeCompare(b.air_date) || a.show_type.localeCompare(b.show_type));
      return out;
    }
    const res = await fetch(`${API}/api/events?year=${year}&month=${month}`);
    if (!res.ok) throw new Error(`API ${res.status}`);
    return res.json();
  }

  async function getEventDetail(id) {
    if (detailCache.has(id)) return detailCache.get(id);
    let result;
    if (BUNDLE) {
      const ev = BUNDLE.events[String(id)];
      if (!ev) throw new Error(`event ${id} not in bundle`);
      result = ev;
    } else {
      const res = await fetch(`${API}/api/events/${id}`);
      if (!res.ok) throw new Error(`API ${res.status}`);
      result = await res.json();
    }
    detailCache.set(id, result);
    return result;
  }

  // Get all events in a month with full detail for wrestler aggregation.
  async function getMonthDetailed(year, month) {
    const summaries = await getMonthEvents(year, month);
    return Promise.all(summaries.map(s => getEventDetail(s.id)));
  }

  // ------------------ Spoilers --------------------------------------------
  let spoilers = sessionStorage.getItem(SPOILER_KEY) === '1';
  function applySpoilerClass() {
    document.body.classList.toggle('spoilers-on', spoilers);
    for (const btn of spoilerButtons) {
      btn.setAttribute('aria-pressed', spoilers ? 'true' : 'false');
      const label = btn.querySelector('.sp-label');
      if (label) label.textContent = spoilers ? 'Spoilers On' : 'Spoilers Off';
      btn.title = spoilers
        ? 'Spoilers are ON: winners and finishes are visible. Click to hide them.'
        : 'Spoilers are OFF: winners and finishes stay hidden. Click to reveal them.';
    }
  }
  function toggleSpoilers() {
    spoilers = !spoilers;
    sessionStorage.setItem(SPOILER_KEY, spoilers ? '1' : '0');
    applySpoilerClass();
  }
  for (const btn of spoilerButtons) btn.addEventListener('click', toggleSpoilers);
  applySpoilerClass();

  // ------------------ Bookmark + Resume -----------------------------------
  // A single "where am I" marker for the watch order, kept in localStorage so
  // it survives across sessions (unlike the per-session spoiler pref). It lives
  // in each visitor's own browser, scoped to this origin: every person keeps
  // their own position, no account and no backend. The key is namespaced
  // because GitHub Pages project sites share one origin.
  const BOOKMARK_KEY = 'wvez_wrestling_bookmark';
  let bookmarkId = (() => {
    try { return localStorage.getItem(BOOKMARK_KEY) || null; } catch (_) { return null; }
  })();

  function saveBookmark(id) {
    try {
      if (id == null) localStorage.removeItem(BOOKMARK_KEY);
      else localStorage.setItem(BOOKMARK_KEY, String(id));
    } catch (_) { /* storage blocked (private mode): keep it in memory only */ }
  }

  function fmtDateLong(iso) {
    const p = String(iso || '').split('-');
    const y = +p[0], m = +p[1], d = +p[2];
    if (!y || !m || !d) return '';
    return `${MONTHS_SHORT[m - 1]} ${d}, ${y}`;
  }

  // Bundle-only: the shipped product always has BUNDLE. In dev API mode we
  // can't validate ids, so the feature stays dormant rather than guessing.
  function eventExists(id) {
    return Boolean(id != null && BUNDLE && BUNDLE.events && BUNDLE.events[String(id)]);
  }

  function toggleBookmark(id) {
    if (id == null || id === '') return;
    id = String(id);
    bookmarkId = (bookmarkId === id) ? null : id;
    saveBookmark(bookmarkId);
    refreshBookmarkUI();
  }

  // Mark the calendar day holding the bookmarked event, if it is in the month
  // currently rendered. Day cells carry data-iso (set in renderCalendar).
  function markBookmarkedDay() {
    if (!calEl) return;
    calEl.querySelectorAll('.day.has-bookmark').forEach(d => d.classList.remove('has-bookmark'));
    if (!eventExists(bookmarkId)) return;
    const iso = BUNDLE.events[String(bookmarkId)].air_date;
    if (!iso) return;
    const cell = calEl.querySelector(`.day[data-iso="${iso}"]`);
    if (cell) cell.classList.add('has-bookmark');
  }

  // Sync every bookmark-aware control to current state: the header Resume
  // button, any bookmark toggles in an open modal, and the calendar marker.
  function refreshBookmarkUI() {
    if (bookmarkId != null && !eventExists(bookmarkId)) {
      bookmarkId = null;            // drop a stale id (e.g. removed from bundle)
      saveBookmark(null);
    }
    const resumeBtn = el('resume-btn');
    if (resumeBtn) {
      if (eventExists(bookmarkId)) {
        const ev = BUNDLE.events[String(bookmarkId)];
        const dateEl = resumeBtn.querySelector('.rs-date');
        if (dateEl) dateEl.textContent = fmtDateLong(ev.air_date);
        resumeBtn.title = `Resume at ${ev.ppv_name || ev.title || ev.air_date}`;
        resumeBtn.hidden = false;
      } else {
        resumeBtn.hidden = true;
      }
    }
    mContent.querySelectorAll('[data-bookmark-id]').forEach(btn => {
      const on = btn.getAttribute('data-bookmark-id') === String(bookmarkId);
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      const lbl = btn.querySelector('.bm-label');
      if (lbl) lbl.textContent = on ? 'Resume point' : 'Resume here';
      btn.title = on ? 'This is your resume point. Click to clear.' : 'Set this show as your resume point';
    });
    markBookmarkedDay();
  }

  const resumeBtnEl = el('resume-btn');
  if (resumeBtnEl) {
    resumeBtnEl.addEventListener('click', () => {
      if (eventExists(bookmarkId)) navigateToEvent(bookmarkId);
    });
  }

  // ------------------ Watched tracking ------------------------------------
  // Set of event ids the viewer has marked watched, in localStorage so it
  // persists per browser/device. Drives the per-show toggle and the global
  // "N / total watched" meter in the tabs row.
  const WATCHED_KEY = 'wvez_wrestling_watched';
  // Map of eventId -> timestamp watched (ms). Timestamps drive the Watched
  // history's "recently watched" order. Migrates the old array-of-ids format.
  let watched = (() => {
    let raw = [];
    try { raw = JSON.parse(localStorage.getItem(WATCHED_KEY) || '[]'); } catch (_) {}
    const m = new Map();
    if (Array.isArray(raw)) {
      for (const item of raw) {
        if (Array.isArray(item)) m.set(String(item[0]), Number(item[1]) || 0); // [id, ts]
        else if (item != null) m.set(String(item), 0);                          // legacy: id only
      }
    }
    if (BUNDLE && BUNDLE.events) {
      for (const id of [...m.keys()]) if (!BUNDLE.events[id]) m.delete(id); // drop stale ids
    }
    return m;
  })();

  function saveWatched() {
    try { localStorage.setItem(WATCHED_KEY, JSON.stringify([...watched])); } catch (_) {}
  }

  function toggleWatched(id) {
    if (id == null || id === '') return;
    id = String(id);
    if (watched.has(id)) watched.delete(id);
    else watched.set(id, Date.now());
    saveWatched();
    refreshWatchedUI();
